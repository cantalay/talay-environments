fullnameOverride: todogi-be
environment: prod
replicaCount: 1

image:
  repository: ghcr.io/cantalay/todogi-be
  tag: "1.0.14"
  pullPolicy: IfNotPresent

runtime:
  type: java
  java:
    agent:
      enabled: true

containerPort: 8080

config:
  SPRING_PROFILES_ACTIVE: prod
  SERVER_PORT: "8080"

externalSecret:
  enabled: true
  remoteKey: todogi/backend
  targetName: todogi-backend-secrets

observability:
  enabled: true
  serviceName: todogi-be
  samplingRatio: "0.25"

probes:
  startup:
    enabled: true
    path: /actuator/health
  readiness:
    enabled: true
    path: /actuator/health
  liveness:
    enabled: true
    path: /actuator/health

serviceMonitor:
  enabled: true
  path: /actuator/prometheus

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false

ingress:
  enabled: true
  hosts:
    - host: api.singlestranger.com
      paths:
        - path: /api
          pathType: Prefix
    - host: www.api.singlestranger.com
      paths:
        - path: /api
          pathType: Prefix
  tls:
    - secretName: todogi-backend-tls
      hosts:
        - api.singlestranger.com
        - www.api.singlestranger.com
