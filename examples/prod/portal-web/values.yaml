environment: prod
replicaCount: 2
image:
  repository: ghcr.io/example/portal-web
  tag: sha-replace-me
runtimeConfig:
  API_BASE_URL: https://api.cantalay.com
  OIDC_ISSUER: https://auth.cantalay.com/realms/talay
  OIDC_CLIENT_ID: talay-web
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
podDisruptionBudget:
  enabled: true
  minAvailable: 1
ingress:
  enabled: true
  hosts:
    - host: app.cantalay.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: portal-web-prod-tls
      hosts: [app.cantalay.com]
