fullnameOverride: todogi-expo-app
environment: prod
replicaCount: 1

# The current 1.0.27 image runs as root on port 80. Rebuild it as a non-root,
# read-only image listening on 8080 before promoting this example into apps/.
image:
  repository: ghcr.io/cantalay/todogi-app
  tag: "1.0.27"
  pullPolicy: IfNotPresent

containerPort: 8080

runtimeConfig:
  EXPO_PUBLIC_API_URL: https://api.singlestranger.com
  NODE_ENV: production

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false

ingress:
  enabled: true
  hosts:
    - host: todogi.singlestranger.com
      paths:
        - path: /
          pathType: Prefix
    - host: www.todogi.singlestranger.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: todogi-app-tls
      hosts:
        - todogi.singlestranger.com
        - www.todogi.singlestranger.com
