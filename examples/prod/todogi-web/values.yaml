fullnameOverride: todogi-expo-app
environment: prod
replicaCount: 1

image:
  repository: ghcr.io/cantalay/todogi-app
  tag: "1.0.27"
  pullPolicy: IfNotPresent

registrySecret:
  enabled: true
  remoteKey: platform/registry/ghcr
  targetName: ghcr-pull

containerPort: 8080

runtimeConfig:
  EXPO_PUBLIC_API_URL: https://api.singlestranger.com
  EXPO_PUBLIC_AUTH_URL: https://auth.cantalay.com
  NODE_ENV: production

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false

ingress:
  enabled: true
  hosts:
    - host: todogi.singlestranger.com
      paths:
        - path: /
          pathType: Prefix
    - host: www.todogi.singlestranger.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: todogi-app-tls
      hosts:
        - todogi.singlestranger.com
        - www.todogi.singlestranger.com
