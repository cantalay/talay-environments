environment: prod
replicaCount: 2
image:
  repository: ghcr.io/example/catalog-api
  tag: sha-replace-me
runtime:
  type: java
  java:
    agent:
      enabled: true
observability:
  samplingRatio: "0.10"
probes:
  startup:
    path: /actuator/health/readiness
  readiness:
    path: /actuator/health/readiness
  liveness:
    path: /actuator/health/liveness
serviceMonitor:
  enabled: true
  path: /actuator/prometheus
externalSecret:
  enabled: true
  remoteKey: apps/prod/catalog-api
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
podDisruptionBudget:
  enabled: true
  minAvailable: 1
ingress:
  enabled: true
  hosts:
    - host: api.cantalay.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: catalog-api-prod-tls
      hosts: [api.cantalay.com]
