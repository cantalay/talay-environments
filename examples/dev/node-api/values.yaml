environment: dev
image:
  repository: ghcr.io/example/node-api
  tag: sha-replace-me
runtime:
  type: node
  node:
    autoInstrumentation:
      enabled: true
probes:
  startup:
    path: /health/startup
  readiness:
    path: /health/ready
  liveness:
    path: /health/live
serviceMonitor:
  enabled: true
  path: /metrics
externalSecret:
  enabled: true
  remoteKey: apps/dev/node-api
ingress:
  enabled: true
  hosts:
    - host: node-api.dev.cantalay.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: node-api-dev-tls
      hosts: [node-api.dev.cantalay.com]
