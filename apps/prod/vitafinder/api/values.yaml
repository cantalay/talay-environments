fullnameOverride: vitafinder-api
environment: prod
partOf: vita-finder
replicaCount: 1

image:
  repository: ghcr.io/cantalay/vitafinder-core
  tag: "sha-4eff081"
  digest: "sha256:4eb2f7825e738bede38ace83e288f9813472a7f141592d96331676a3c82723d4"
  pullPolicy: IfNotPresent

registrySecret:
  enabled: true
  remoteKey: platform/registry/ghcr
  targetName: ghcr-pull

runtime:
  type: node
  node:
    autoInstrumentation:
      enabled: true

containerPort: 3000

config:
  NODE_ENV: production
  PORT: "3000"
  NODE_PATH: /app/apps/api/node_modules
  VITAFINDER_PROCESS_TYPE: api
  KEYCLOAK_ISSUER_URL: https://auth.cantalay.com/realms/vitafinder
  KEYCLOAK_AUDIENCE: vitafinder-api
  CORS_ORIGINS: https://vitafinder.cantalay.com,https://admin.vitafinder.cantalay.com

observability:
  enabled: true
  serviceName: vitafinder-api
  samplingRatio: "0.25"

probes:
  startup:
    enabled: true
    path: /health/startup
    failureThreshold: 30
    periodSeconds: 5
  readiness:
    enabled: true
    path: /health/ready
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    enabled: true
    path: /health/live
    initialDelaySeconds: 15
    periodSeconds: 20

serviceMonitor:
  enabled: true
  path: /metrics
  interval: 30s

resources:
  requests:
    cpu: 25m
    memory: 128Mi
  limits:
    memory: 384Mi

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false
