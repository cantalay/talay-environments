fullnameOverride: vitafinder-api
environment: prod
partOf: vita-finder
replicaCount: 1
# a release starts the new pod before stopping the old one: the storefront's API calls do not fail during deploys
rollingUpdate:
  maxSurge: 1
  maxUnavailable: 0
preStopSleepSeconds: 5

image:
  repository: ghcr.io/cantalay/vitafinder-core
  tag: "sha-459aa5f"
  digest: "sha256:73c19daf828a8f77af782990c79b901ca795d9ccff3db8f7dadb25b223bfbc94"
  pullPolicy: IfNotPresent

registrySecret:
  enabled: true
  remoteKey: platform/registry/ghcr
  targetName: ghcr-pull

runtime:
  type: node
  node:
    autoInstrumentation:
      enabled: true

containerPort: 8080

config:
  NODE_ENV: production
  # IndexNow (Bing/Yandex) key: public by design, served at vita-pick.com/<key>.txt; the worker submits changed pages daily
  INDEXNOW_KEY: "5e72ab0d310eaaeea045de9defb28322"
  PORT: "8080"
  PUBLIC_API_URL: https://api.vita-pick.com
  PUBLIC_WEB_URL: https://vita-pick.com
  PUBLIC_ADMIN_URL: https://admin.vita-pick.com
  # cloud metadata detectors (gcp/aws) only add startup noise on this host
  OTEL_NODE_RESOURCE_DETECTORS: env,host,os,process,serviceinstance
  VITAFINDER_PROCESS_TYPE: api
  KEYCLOAK_ISSUER_URL: https://auth.cantalay.com/realms/vitafinder
  KEYCLOAK_AUDIENCE: vitafinder-api
  CORS_ORIGINS: https://vita-pick.com,https://admin.vita-pick.com
  DB_POOL_MAX: "6"

externalSecret:
  enabled: true
  remoteKey: apps/vitafinder/api
  targetName: vitafinder-api-secrets

observability:
  enabled: true
  serviceName: vitafinder-api
  samplingRatio: "0.25"

probes:
  startup:
    enabled: true
    path: /health/startup
    failureThreshold: 60
    periodSeconds: 5
  readiness:
    enabled: true
    path: /health/ready
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    enabled: true
    path: /health/live
    initialDelaySeconds: 15
    periodSeconds: 20

serviceMonitor:
  enabled: true
  path: /metrics
  interval: 30s

resources:
  requests:
    cpu: 50m
    memory: 192Mi
  limits:
    memory: 1Gi

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false

# self-hosted product pictures (/media/p/<id>.webp)
volumes:
  - name: media
    persistentVolumeClaim:
      claimName: vitafinder-media
volumeMounts:
  - name: media
    mountPath: /var/media
