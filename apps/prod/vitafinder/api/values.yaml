fullnameOverride: vitafinder-api
environment: prod
partOf: vita-finder
replicaCount: 1

image:
  repository: ghcr.io/cantalay/vitafinder-core
  tag: "sha-d552651"
  digest: "sha256:f776d171fe3e328ca1f523153933885a4fca903be535134a94d9b7d5cb077d2c"
  pullPolicy: IfNotPresent

registrySecret:
  enabled: true
  remoteKey: platform/registry/ghcr
  targetName: ghcr-pull

runtime:
  type: node
  node:
    autoInstrumentation:
      enabled: true

containerPort: 8080

config:
  NODE_ENV: production
  PORT: "8080"
  PUBLIC_API_URL: https://api.vita-pick.com
  PUBLIC_WEB_URL: https://vita-pick.com
  PUBLIC_ADMIN_URL: https://admin.vita-pick.com
  # cloud metadata detectors (gcp/aws) only add startup noise on this host
  OTEL_NODE_RESOURCE_DETECTORS: env,host,os,process,serviceinstance
  VITAFINDER_PROCESS_TYPE: api
  KEYCLOAK_ISSUER_URL: https://auth.cantalay.com/realms/vitafinder
  KEYCLOAK_AUDIENCE: vitafinder-api
  CORS_ORIGINS: https://vita-pick.com,https://admin.vita-pick.com
  DB_POOL_MAX: "6"

externalSecret:
  enabled: true
  remoteKey: apps/vitafinder/api
  targetName: vitafinder-api-secrets

observability:
  enabled: true
  serviceName: vitafinder-api
  samplingRatio: "0.25"

probes:
  startup:
    enabled: true
    path: /health/startup
    failureThreshold: 60
    periodSeconds: 5
  readiness:
    enabled: true
    path: /health/ready
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    enabled: true
    path: /health/live
    initialDelaySeconds: 15
    periodSeconds: 20

serviceMonitor:
  enabled: true
  path: /metrics
  interval: 30s

resources:
  requests:
    cpu: 50m
    memory: 192Mi
  limits:
    memory: 512Mi

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false
