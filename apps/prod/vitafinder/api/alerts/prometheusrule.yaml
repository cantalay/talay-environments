apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: vitafinder-api-alerts
  labels:
    app.kubernetes.io/name: vitafinder-api
    app.kubernetes.io/part-of: vita-finder
    talay.io/environment: prod
spec:
  groups:
    - name: vitafinder-api
      rules:
        - alert: TalayAppDown
          expr: sum(up{namespace="vitafinder-api"}) == 0
          for: 5m
          labels: { severity: critical, project: vitafinder }
          annotations:
            summary: "vitafinder-api scrape hedefi 5 dakikadır ayakta değil"
        - alert: TalayAppCrashLooping
          expr: increase(kube_pod_container_status_restarts_total{namespace="vitafinder-api"}[15m]) > 3
          labels: { severity: warning, project: vitafinder }
          annotations:
            summary: "vitafinder-api içinde pod 15 dakikada 3'ten fazla yeniden başladı"
        - alert: TalayAppHighErrorRate
          expr: |
            sum(rate(http_server_request_duration_seconds_count{k8s_namespace_name="vitafinder-api",http_response_status_code=~"5.."}[5m]))
              / clamp_min(sum(rate(http_server_request_duration_seconds_count{k8s_namespace_name="vitafinder-api"}[5m])), 1e-9) > 0.05
          for: 10m
          labels: { severity: warning, project: vitafinder }
          annotations:
            summary: "vitafinder-api 5xx oranı %5'in üzerinde"
        - alert: TalayAppSlow
          expr: histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{k8s_namespace_name="vitafinder-api"}[5m]))) > 1
          for: 10m
          labels: { severity: warning, project: vitafinder }
          annotations:
            summary: "vitafinder-api p95 gecikme 1 saniyenin üzerinde"
