apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vitafinder-storefront-tls
  labels:
    app.kubernetes.io/name: vitafinder-storefront
    app.kubernetes.io/part-of: vita-finder
    talay.io/environment: prod
spec:
  secretName: vitafinder-storefront-tls
  dnsNames:
    - vita-pick.com
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt
  usages:
    - digital signature
    - key encipherment
