fullnameOverride: vitafinder-storefront
environment: prod
partOf: vita-finder
replicaCount: 1

image:
  repository: ghcr.io/cantalay/vitafinder-web
  tag: "sha-c9dced0"
  digest: "sha256:8274d033168b91dcd6d607ad2a01f72b96a35c0edac9070d45acfc65437d5778"
  pullPolicy: IfNotPresent

registrySecret:
  enabled: true
  remoteKey: platform/registry/ghcr
  targetName: ghcr-pull

containerPort: 8080
webRoot: /usr/share/nginx/html/storefront

runtimeConfig:
  API_URL: https://api.vita-pick.com
  AUTH_URL: https://auth.cantalay.com
  AUTH_REALM: vitafinder
  WEB_URL: https://vita-pick.com
  ADMIN_URL: https://admin.vita-pick.com

nginx:
  existingConfigMap: vitafinder-storefront-nginx
  configRevision: "3"

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false
