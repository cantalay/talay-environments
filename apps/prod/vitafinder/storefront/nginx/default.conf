# Security headers are repeated inside every location that sets its own add_header:
# nginx does not inherit server-level add_header into such locations.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html/storefront;
  index index.html;
  server_tokens off;

  # resolve the API's public name at request time (cluster DNS), so a DNS hiccup at start-up cannot stop nginx
  resolver 10.43.0.10 valid=60s ipv6=off;
  set $seo_api api.vita-pick.com;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;

  if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
    return 405;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /runtime-config.js {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location = /sw.js {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control "no-cache";
    add_header Service-Worker-Allowed "/";
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location /assets/ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # SEO: pages are rendered by the API (/seo/render: page-specific head, schema.org data and content for crawlers and
  # AI agents) through its public host, since only the ingress may reach the API. If the API fails, the plain SPA
  # shell is served, so the site never depends on it.
  location = /robots.txt {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    proxy_pass https://$seo_api/seo/robots.txt;
    proxy_set_header Host api.vita-pick.com;
    proxy_ssl_server_name on;
    proxy_ssl_name api.vita-pick.com;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=3600";
  }

  location = /llms.txt {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    proxy_pass https://$seo_api/seo/llms.txt;
    proxy_set_header Host api.vita-pick.com;
    proxy_ssl_server_name on;
    proxy_ssl_name api.vita-pick.com;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=3600";
  }

  location ~ ^/(sitemap(?:-[a-z]+(?:-[0-9]+)?)?\.xml)$ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    proxy_pass https://$seo_api/seo/$1;
    proxy_set_header Host api.vita-pick.com;
    proxy_ssl_server_name on;
    proxy_ssl_name api.vita-pick.com;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=3600";
  }

  location / {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    try_files $uri @render;
    add_header Cache-Control "no-cache";
  }

  location @render {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    proxy_pass https://$seo_api/seo/render;
    proxy_set_header Host api.vita-pick.com;
    proxy_set_header X-Seo-Path $request_uri;
    proxy_set_header User-Agent $http_user_agent;
    proxy_ssl_server_name on;
    proxy_ssl_name api.vita-pick.com;
    proxy_connect_timeout 3s;
    proxy_read_timeout 8s;
    proxy_intercept_errors on;
    error_page 500 502 503 504 = @spa;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-cache";
  }

  location @spa {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
  }

}
