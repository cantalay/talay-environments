apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: []

configMapGenerator:
  - name: vitafinder-admin-nginx
    files:
      - default.conf=nginx/default.conf

generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/name: vitafinder-admin
    app.kubernetes.io/part-of: vitafinder
    talay.io/environment: prod
