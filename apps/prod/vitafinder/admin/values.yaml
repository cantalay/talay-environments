fullnameOverride: vitafinder-admin
environment: prod
partOf: vita-finder
replicaCount: 1

image:
  repository: ghcr.io/cantalay/vitafinder-web
  tag: "sha-ecde94f"
  digest: "sha256:dc8d507c5defed37d3eecd4e19e17252fbffb2570d50d120fb83fb097570649a"
  pullPolicy: IfNotPresent

registrySecret:
  enabled: true
  remoteKey: platform/registry/ghcr
  targetName: ghcr-pull

containerPort: 8080
webRoot: /usr/share/nginx/html/admin

runtimeConfig:
  API_URL: https://api.vita-pick.com
  AUTH_URL: https://auth.cantalay.com
  AUTH_REALM: vitafinder
  WEB_URL: https://vita-pick.com
  ADMIN_URL: https://admin.vita-pick.com

nginx:
  existingConfigMap: vitafinder-admin-nginx
  configRevision: "3"

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false
