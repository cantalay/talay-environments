fullnameOverride: vitafinder-admin
environment: prod
partOf: vita-finder
replicaCount: 1

image:
  repository: ghcr.io/cantalay/vitafinder-web
  tag: "sha-b494613"
  digest: "sha256:767d3559aba70e03a602552a384eac2662a680971fa9d575ff44acc4925e4cf8"
  pullPolicy: IfNotPresent

registrySecret:
  enabled: true
  remoteKey: platform/registry/ghcr
  targetName: ghcr-pull

containerPort: 8080
webRoot: /usr/share/nginx/html/admin

runtimeConfig:
  API_URL: https://api.vita-pick.com
  AUTH_URL: https://auth.cantalay.com
  AUTH_REALM: vitafinder
  WEB_URL: https://vita-pick.com
  ADMIN_URL: https://admin.vita-pick.com

nginx:
  existingConfigMap: vitafinder-admin-nginx
  configRevision: "3"

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false
