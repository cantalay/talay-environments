fullnameOverride: vitafinder-admin
environment: prod
partOf: vita-finder
replicaCount: 1

image:
  repository: ghcr.io/cantalay/vitafinder-web
  tag: "sha-0ead2d9"
  digest: "sha256:3de5e25f342225b214e64c02c961c2119e704ea1c70f5c036c0e76ccf0f21ee7"
  pullPolicy: IfNotPresent

registrySecret:
  enabled: true
  remoteKey: platform/registry/ghcr
  targetName: ghcr-pull

containerPort: 8080
