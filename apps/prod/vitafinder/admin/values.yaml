fullnameOverride: vitafinder-admin
environment: prod
partOf: vita-finder
replicaCount: 1

image:
  repository: ghcr.io/cantalay/vitafinder-web
  tag: "sha-f12f9b6"
  digest: "sha256:40009e8b74e58d7b1cc8e8e32bf3bc7dc90de6e84b2367b5251d89b65ff1194c"
  pullPolicy: IfNotPresent

registrySecret:
  enabled: true
  remoteKey: platform/registry/ghcr
  targetName: ghcr-pull

containerPort: 8080
webRoot: /usr/share/nginx/html/admin

runtimeConfig:
  API_URL: https://api.vita-pick.com
  AUTH_URL: https://auth.cantalay.com
  AUTH_REALM: vitafinder
  WEB_URL: https://vita-pick.com
  ADMIN_URL: https://admin.vita-pick.com

nginx:
  existingConfigMap: vitafinder-admin-nginx
  configRevision: "3"

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false
