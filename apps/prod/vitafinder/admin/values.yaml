  KEYCLOAK_CLIENT_ID: vitafinder-admin

nginx:
  existingConfigMap: vitafinder-admin-nginx
  configRevision: "1"

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false
