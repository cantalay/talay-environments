fullnameOverride: vitafinder-admin
environment: prod
partOf: vita-finder
replicaCount: 1

image:
  repository: ghcr.io/cantalay/vitafinder-web
  tag: "sha-ff27486"
  digest: "sha256:7adcef8076cdb6b6813c4d32dfe21e02573cfb7b0f3e3b8b7d30c9b0c2e6b3a3"
  pullPolicy: IfNotPresent

registrySecret:
