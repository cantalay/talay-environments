fullnameOverride: vitafinder-worker
environment: prod
partOf: vita-finder
replicaCount: 1

image:
  repository: ghcr.io/cantalay/vitafinder-core
  tag: "sha-ace28eb"
  digest: "sha256:7959f4ec08009ac095185bbc5f4812ab450e08cc1d2741bf4abe8134223a8e0b"
  pullPolicy: IfNotPresent

registrySecret:
  enabled: true
  remoteKey: platform/registry/ghcr
  targetName: ghcr-pull

runtime:
  type: node
  node:
    autoInstrumentation:
      enabled: true

containerPort: 8080

config:
  NODE_ENV: production
  PORT: "8080"
  PUBLIC_API_URL: https://api.vita-pick.com
  PUBLIC_WEB_URL: https://vita-pick.com
  PUBLIC_ADMIN_URL: https://admin.vita-pick.com
  # cloud metadata detectors (gcp/aws) only add startup noise on this host
  OTEL_NODE_RESOURCE_DETECTORS: env,host,os,process,serviceinstance
  VITAFINDER_PROCESS_TYPE: worker
  KEYCLOAK_ISSUER_URL: https://auth.cantalay.com/realms/vitafinder
  # Toplam eşzamanlı sayfa; aktif sağlayıcı sayısından büyük tutulur. Asıl sınır site başına rps (provider ayarı).
  CRAWL_GLOBAL_CONCURRENCY: "24"
  DB_POOL_MAX: "12"

externalSecret:
  enabled: true
  remoteKey: apps/vitafinder/worker
  targetName: vitafinder-worker-secrets

observability:
  enabled: true
  serviceName: vitafinder-worker
  samplingRatio: "0.10"

probes:
  startup:
    enabled: true
    path: /health/startup
    failureThreshold: 60
    periodSeconds: 5
  readiness:
    enabled: true
    path: /health/ready
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    enabled: true
    path: /health/live
    initialDelaySeconds: 15
    periodSeconds: 20

serviceMonitor:
  enabled: true
  path: /metrics
  interval: 30s

resources:
  requests:
    cpu: 250m
    memory: 384Mi
  limits:
    memory: 1Gi

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false
