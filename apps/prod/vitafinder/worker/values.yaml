fullnameOverride: vitafinder-worker
environment: prod
partOf: vita-finder
replicaCount: 1

image:
  repository: ghcr.io/cantalay/vitafinder-core
  tag: "sha-4eff081"
  digest: "sha256:4eb2f7825e738bede38ace83e288f9813472a7f141592d96331676a3c82723d4"
  pullPolicy: IfNotPresent

registrySecret:
  enabled: true
  remoteKey: platform/registry/ghcr
  targetName: ghcr-pull

runtime:
  type: node
  node:
    autoInstrumentation:
      enabled: true

containerPort: 3001

config:
  NODE_ENV: production
  PORT: "3001"
  NODE_PATH: /app/apps/worker/node_modules
  VITAFINDER_PROCESS_TYPE: worker

observability:
  enabled: true
  serviceName: vitafinder-worker
  samplingRatio: "0.10"

probes:
  startup:
    enabled: true
    path: /health/startup
    failureThreshold: 30
    periodSeconds: 5
  readiness:
    enabled: true
    path: /health/ready
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    enabled: true
    path: /health/live
    initialDelaySeconds: 15
    periodSeconds: 20

serviceMonitor:
  enabled: true
  path: /metrics
  interval: 30s

resources:
  requests:
    cpu: 25m
    memory: 128Mi
  limits:
    memory: 384Mi

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false
