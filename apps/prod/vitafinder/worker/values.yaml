fullnameOverride: vitafinder-worker
environment: prod
partOf: vita-finder
replicaCount: 1

image:
  repository: ghcr.io/cantalay/vitafinder-core
  tag: "sha-7c5ff7c"
  digest: "sha256:bfa85c6c71eb247ffce6669426bdaa13a313e1988a4aeb19cc9f067498d71d7d"
  pullPolicy: IfNotPresent

registrySecret:
  enabled: true
  remoteKey: platform/registry/ghcr
  targetName: ghcr-pull

runtime:
  type: node
  node:
    autoInstrumentation:
      enabled: true

containerPort: 8080

config:
  NODE_ENV: production
  PORT: "8080"
  PUBLIC_API_URL: https://api.vitafinder.cantalay.com
  PUBLIC_WEB_URL: https://vitafinder.cantalay.com
  PUBLIC_ADMIN_URL: https://admin.vitafinder.cantalay.com
  # cloud metadata detectors (gcp/aws) only add startup noise on this host
  OTEL_NODE_RESOURCE_DETECTORS: env,host,os,process,serviceinstance
  VITAFINDER_PROCESS_TYPE: worker
  KEYCLOAK_ISSUER_URL: https://auth.cantalay.com/realms/vitafinder
  CRAWL_GLOBAL_CONCURRENCY: "4"
  DB_POOL_MAX: "6"

externalSecret:
  enabled: true
  remoteKey: apps/vitafinder/worker
  targetName: vitafinder-worker-secrets

observability:
  enabled: true
  serviceName: vitafinder-worker
  samplingRatio: "0.10"

probes:
  startup:
    enabled: true
    path: /health/startup
    failureThreshold: 60
    periodSeconds: 5
  readiness:
    enabled: true
    path: /health/ready
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    enabled: true
    path: /health/live
    initialDelaySeconds: 15
    periodSeconds: 20

serviceMonitor:
  enabled: true
  path: /metrics
  interval: 30s

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 640Mi

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false
