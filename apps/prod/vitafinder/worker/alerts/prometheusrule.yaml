apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: vitafinder-worker-alerts
  labels:
    app.kubernetes.io/name: vitafinder-worker
    app.kubernetes.io/part-of: vita-finder
    talay.io/environment: prod
spec:
  groups:
    - name: vitafinder-worker
      rules:
        - alert: TalayAppDown
          expr: sum(up{namespace="vitafinder-worker"}) == 0
          for: 5m
          labels: { severity: critical, project: vitafinder }
          annotations:
            summary: "vitafinder-worker scrape hedefi 5 dakikadır ayakta değil"
        - alert: TalayAppCrashLooping
          expr: increase(kube_pod_container_status_restarts_total{namespace="vitafinder-worker"}[15m]) > 3
          labels: { severity: warning, project: vitafinder }
          annotations:
            summary: "vitafinder-worker içinde pod 15 dakikada 3'ten fazla yeniden başladı"
        - alert: VitaFinderProviderStale
          expr: max by (provider) (vitafinder_provider_freshness_seconds{namespace="vitafinder-worker"}) > 6 * 3600
          for: 30m
          labels: { severity: warning, project: vitafinder }
          annotations:
            summary: "{{ $labels.provider }} 6 saattir başarılı veri vermiyor (engel, yapı değişikliği veya ağ)"
        - alert: VitaFinderProviderErrorRate
          expr: |
            sum by (provider) (rate(vitafinder_provider_requests_total{namespace="vitafinder-worker",status!~"2..|404"}[30m]))
              / clamp_min(sum by (provider) (rate(vitafinder_provider_requests_total{namespace="vitafinder-worker"}[30m])), 1e-9) > 0.5
          for: 30m
          labels: { severity: warning, project: vitafinder }
          annotations:
            summary: "{{ $labels.provider }} isteklerinin yarısından fazlası başarısız"
        - alert: VitaFinderNotificationBacklog
          expr: max(vitafinder_notification_pending{namespace="vitafinder-worker"}) > 500
          for: 30m
          labels: { severity: warning, project: vitafinder }
          annotations:
            summary: "500'den fazla bildirim 30 dakikadır teslim bekliyor"
        - alert: VitaFinderJobsFailing
          expr: sum by (job) (increase(vitafinder_job_runs_total{namespace="vitafinder-worker",status="failed"}[1h])) > 20
          labels: { severity: warning, project: vitafinder }
          annotations:
            summary: "Arka plan işi {{ $labels.job }} son 1 saatte 20'den fazla başarısız"
        - alert: VitaFinderMemoryHigh
          expr: |
            max(container_memory_working_set_bytes{namespace="vitafinder-worker",container!="",container!="POD"})
              / max(kube_pod_container_resource_limits{namespace="vitafinder-worker",resource="memory"}) > 0.85
          for: 15m
          labels: { severity: warning, project: vitafinder }
          annotations:
            summary: "vitafinder-worker bellek kullanımı 15 dakikadır sınırın %85'inin üzerinde (OOM yeniden başlatma yakın)"
