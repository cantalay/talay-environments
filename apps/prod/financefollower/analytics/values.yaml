externalSecret:
  enabled: true
  remoteKey: apps/financefollower/analytics
  targetName: financefollower-analytics-secrets

observability:
  enabled: true
  serviceName: financefollower-analytics
  samplingRatio: "0.1"

probes:
  startup:
    enabled: true
    path: /health/startup
    failureThreshold: 30
    periodSeconds: 5
  readiness:
    enabled: true
    path: /health/ready
    periodSeconds: 15
  liveness:
    enabled: true
    path: /health/live
    periodSeconds: 20

serviceMonitor:
  enabled: true
  path: /metrics
  interval: 60s

# Evren taraması ilk tam indirmede ~700 MB'a; haftalık strateji testi (ABD, 5 yıl) ~1,5–2 GB'a çıkar.
resources:
  requests:
    cpu: 300m
    memory: 512Mi
  limits:
    memory: 2560Mi

# /internal/* (makro katalog araması) yalnız API pod'larına açıktır; ingress yoktur.
networkPolicy:
  enabled: true
  additionalIngress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: financefollower-api
      ports:
        - protocol: TCP
          port: 8080

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false
