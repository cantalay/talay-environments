fullnameOverride: financefollower-analytics
environment: prod
partOf: financefollower
replicaCount: 1                 # zamanlanmış işler ve komut tüketicisi tek replika varsayar

image:
  repository: ghcr.io/cantalay/finance-follower-analytics
  tag: "sha-02a852f"
  digest: "sha256:cd9ab960610633b674b63db3912b99888c765eb2febf0d74207213d7cd95f2f1"
  pullPolicy: IfNotPresent

registrySecret:
  enabled: true
  remoteKey: platform/registry/ghcr
  targetName: ghcr-pull

# Python: chart OTel enjekte etmez; imaj opentelemetry-instrument ile başlar ve chart'ın OTEL_* env'lerini kullanır.
runtime:
  type: other

containerPort: 8080

config:
  PORT: "8080"
  DEPLOYMENT_ENVIRONMENT: prod
  REDIS_KEY_PREFIX: "financefollower:"
  SCHEDULER_ENABLED: "true"
  QUOTE_INTERVAL_SECONDS: "120"
  BARS_INTERVAL_MINUTES: "30"
  BACKFILL_YEARS: "3"

externalSecret:
  enabled: true
  remoteKey: apps/financefollower/analytics
  targetName: financefollower-analytics-secrets

observability:
  enabled: true
  serviceName: financefollower-analytics
  samplingRatio: "0.1"

probes:
  startup:
    enabled: true
    path: /health/startup
    failureThreshold: 30
    periodSeconds: 5
  readiness:
    enabled: true
    path: /health/ready
    periodSeconds: 15
  liveness:
    enabled: true
    path: /health/live
    periodSeconds: 20

serviceMonitor:
  enabled: true
  path: /metrics
  interval: 60s

# Evren taraması (BIST/ABD/ETF/TEFAS/kripto) ilk tam indirmede ~700 MB'a çıkar.
resources:
  requests:
    cpu: 300m
    memory: 512Mi
  limits:
    memory: 1536Mi

# /internal/* (makro katalog araması) yalnız API pod'larına açıktır; ingress yoktur.
networkPolicy:
  enabled: true
  additionalIngress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: financefollower-api
      ports:
        - protocol: TCP
          port: 8080

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false
