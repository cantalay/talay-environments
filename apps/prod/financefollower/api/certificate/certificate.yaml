apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: financefollower-api-tls
  labels:
    app.kubernetes.io/name: financefollower-api
    app.kubernetes.io/part-of: finance-follower
    talay.io/environment: prod
spec:
  secretName: financefollower-api-tls
  dnsNames:
    - api.finance.cantalay.com
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt
  usages:
    - digital signature
    - key encipherment
