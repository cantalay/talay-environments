# Kurum entegrasyonu (Faz E): API'nin Alpaca paper emir adaptörü için anahtarlar. Değerler tek kaynakta (analytics'in
# Vault yolu) tutulur; burada yalnız iki anahtar API'ye eşlenir. ALPACA_TRADING_URL verilmezse paper adresi kullanılır;
# adaptör paper dışı bir adreste çalışmaz.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: financefollower-api-broker
  labels:
    app.kubernetes.io/name: financefollower-api
    app.kubernetes.io/part-of: financefollower
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: financefollower-api-broker
    creationPolicy: Owner
  data:
    - secretKey: ALPACA_KEY_ID
      remoteRef:
        key: apps/financefollower/analytics
        property: ALPACA_KEY_ID
    - secretKey: ALPACA_SECRET_KEY
      remoteRef:
        key: apps/financefollower/analytics
        property: ALPACA_SECRET_KEY
