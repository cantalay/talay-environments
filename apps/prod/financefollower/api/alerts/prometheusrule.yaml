apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: financefollower-api-alerts
  labels:
    app.kubernetes.io/name: financefollower-api
    app.kubernetes.io/part-of: financefollower
    talay.io/environment: prod
spec:
  groups:
    - name: financefollower-api
      rules:
        - alert: TalayAppDown
          expr: sum(up{namespace="financefollower-api"}) == 0
          for: 5m
          labels: { severity: critical, project: financefollower }
          annotations:
            summary: "financefollower-api scrape hedefi 5 dakikadır ayakta değil"
        - alert: TalayAppCrashLooping
          expr: increase(kube_pod_container_status_restarts_total{namespace="financefollower-api"}[15m]) > 3
          labels: { severity: warning, project: financefollower }
          annotations:
            summary: "financefollower-api içinde pod 15 dakikada 3'ten fazla yeniden başladı"
        - alert: TalayAppHighErrorRate
          expr: |
            sum(rate(http_server_request_duration_seconds_count{k8s_namespace_name="financefollower-api",http_response_status_code=~"5.."}[5m]))
              / clamp_min(sum(rate(http_server_request_duration_seconds_count{k8s_namespace_name="financefollower-api"}[5m])), 1e-9) > 0.05
          for: 10m
          labels: { severity: warning, project: financefollower }
          annotations:
            summary: "financefollower-api 5xx oranı %5'in üzerinde"
        - alert: TalayAppSlow
          expr: histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{k8s_namespace_name="financefollower-api"}[5m]))) > 1
          for: 10m
          labels: { severity: warning, project: financefollower }
          annotations:
            summary: "financefollower-api p95 gecikme 1 saniyenin üzerinde"
        - alert: FinanceFollowerStaleData
          # financefollower_data_stale: api, kaynağın beklenen yenilenme aralığına göre (anlık fiyat 30 dk, günlük
          # kaynaklar 2-4 gün) bayatlığı 0/1 verir; ham saniye eşiği günlük kaynaklarda sürekli alarm üretiyordu
          expr: max by (source) (financefollower_data_stale{source!="TEFAS"}) == 1
          for: 15m
          labels: { severity: warning, project: financefollower }
          annotations:
            summary: "{{ $labels.source }} kaynağı beklenen aralıkta veri vermiyor; sinyaller bayat veriye dayanabilir"
        - alert: FinanceFollowerTefasStale
          expr: max(financefollower_data_staleness_seconds{source="TEFAS"}) > 259200
          for: 1h
          labels: { severity: warning, project: financefollower }
          annotations:
            summary: "TEFAS fon fiyatları 3 gündür güncellenmedi"
        - alert: FinanceFollowerNotificationsStuck
          expr: max(financefollower_notifications_pending) > 10
          for: 30m
          labels: { severity: warning, project: financefollower }
          annotations:
            summary: "Telegram bildirimleri gönderilemiyor (30 dakikadır 10+ bekleyen)"
        - alert: FinanceFollowerBrokerErrors
          expr: sum(increase(financefollower_broker_errors_total[15m])) > 5
          for: 5m
          labels: { severity: warning, project: financefollower }
          annotations:
            summary: "Kurum (Alpaca paper) çağrıları 15 dakikada 5'ten fazla hata verdi; emir senkronu/mutabakat aksıyor"
        - alert: FinanceFollowerBrokerReconciliationDiff
          expr: sum(increase(financefollower_broker_reconciliations_total{result="diff"}[30m])) >= 3
          labels: { severity: warning, project: financefollower }
          annotations:
            summary: "Kurum mutabakatında 30 dakikadır defterle fark var (pozisyon ya da sahipsiz emir); Hesaplar kartından inceleyin"
        - alert: FinanceFollowerSleeveModelStale
          # Strateji kolu modeli beklenen zamanda hesaplanmadı (BIST sinyal kolunda kapanışa yakın adım atılmadı,
          # trend/park modelleri günlerdir yenilenmedi): bot o kolda işlem yapmaz; strateji motoru loglarına bakın
          expr: max by (portfolio, sleeve) (financefollower_sleeve_model_stale) == 1
          for: 30m
          labels: { severity: warning, project: financefollower }
          annotations:
            summary: "{{ $labels.portfolio }} / {{ $labels.sleeve }} kolunun modeli bayat; bot bu kolda işlem yapmıyor"
        - alert: FinanceFollowerSleeveExecutorErrors
          expr: sum(increase(financefollower_sleeve_runs_total{status="ERROR"}[30m])) > 2
          for: 5m
          labels: { severity: warning, project: financefollower }
          annotations:
            summary: "Strateji kolu yürütücüsü 30 dakikada tekrar tekrar hata verdi; emirler aksıyor olabilir"
        - alert: FinanceFollowerSleeveLossHalt
          expr: sum(increase(financefollower_sleeve_runs_total{status="LOSS_HALT"}[15m])) > 0
          labels: { severity: warning, project: financefollower }
          annotations:
            summary: "Bot günlük zarar kilidinde: portföy bugün sınırdan fazla düştü, yeni alım yapılmıyor"
        - alert: FinanceFollowerSleeveIdleCash
          # Fon saatinde (09:30-17:30) nakit para piyasası fonuna gitmiyor: park alımı bir kurala takılıyor olabilir
          # (2026-10-21..23 olayı: sinyal kolu tazelik kuralı parkı kilitledi). Kolların "Şimdi ne yapardı?" planına bakın
          expr: max by (portfolio) (financefollower_sleeve_idle_cash_pct) > 5
          for: 45m
          labels: { severity: warning, project: financefollower }
          annotations:
            summary: "{{ $labels.portfolio }}: toplamın %{{ $value | printf \"%.0f\" }}'i nakitte bekliyor; para piyasasına gitmiyor"
        - alert: FinanceFollowerSleeveOrderBurst
          # Yürütücü 2 dakikada bir çalışır; olağan gün birkaç emirdir. Saatte 25'ten fazla emir bir döngüye işaret eder
          # (2026-10-26/27 olayı: park fonu her çalışmada satılıp geri alındı, günde 478 emir)
          expr: sum(increase(financefollower_sleeve_orders_total[1h])) > 25
          for: 5m
          labels: { severity: critical, project: financefollower }
          annotations:
            summary: "Bot son bir saatte {{ $value | printf \"%.0f\" }} emir verdi; al-sat döngüsü olabilir (Bot › Kararlar)"
        - alert: FinanceFollowerSleeveOrderFuse
          # Emir sigortası (ürün başına günlük bot işlemi sınırı) devreye girdi: bir ürün aynı gün defalarca işlem gördü
          expr: sum(increase(financefollower_sleeve_guard_trips_total{guard="orderCount"}[30m])) > 0
          labels: { severity: critical, project: financefollower }
          annotations:
            summary: "Bot emir sigortası devrede: bir ürün bugün sınırdan fazla işlem gördü, yeni emir durduruldu"
