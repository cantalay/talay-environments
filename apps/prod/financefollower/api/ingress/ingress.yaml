apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: financefollower-api
  labels:
    app.kubernetes.io/name: financefollower-api
    app.kubernetes.io/part-of: finance-follower
    talay.io/environment: prod
spec:
  ingressClassName: traefik
  tls:
    - secretName: financefollower-api-tls
      hosts:
        - api.finance.cantalay.com
  rules:
    - host: api.finance.cantalay.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: financefollower-api
                port:
                  number: 80
