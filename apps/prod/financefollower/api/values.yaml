fullnameOverride: financefollower-api
environment: prod
partOf: finance-follower
replicaCount: 1

image:
  repository: ghcr.io/cantalay/finance-follower-be
  tag: "sha-29f9190"
  digest: "sha256:e459145a2122a7029c2ee5564a8ba067293ed479f165c47ffd399c6e9a8ae72c"
  pullPolicy: IfNotPresent

registrySecret:
  enabled: true
  remoteKey: platform/registry/ghcr
  targetName: ghcr-pull

runtime:
  type: java
  java:
    agent:
      enabled: true

containerPort: 8080

config:
  SPRING_PROFILES_ACTIVE: prod
  SERVER_PORT: "8080"
  DEPLOYMENT_ENVIRONMENT: prod
  KEYCLOAK_ISSUER_URI: https://auth.cantalay.com/realms/financefollower
  KEYCLOAK_AUDIENCE: financefollower-api
  APP_CORS_ALLOWED_ORIGINS: https://finance.cantalay.com
  APP_PUBLIC_URL: https://finance.cantalay.com
  REDIS_KEY_PREFIX: "financefollower:"
  # Webhook yok; dışarıya ek uç açılmaz. TELEGRAM_BOT_TOKEN Vault'ta yoksa Telegram kapalı başlar.
  TELEGRAM_MODE: polling

# SPRING_DATASOURCE_URL/USERNAME/PASSWORD, REDIS_URL, TELEGRAM_BOT_TOKEN (opsiyonel)
externalSecret:
  enabled: true
  remoteKey: apps/financefollower/api
  targetName: financefollower-api-secrets

observability:
  enabled: true
  serviceName: financefollower-api
  samplingRatio: "0.25"

probes:
  # JVM açılışı CPU baskısında dakikalar sürebiliyor; diğer Java servisleriyle aynı tolerans.
  startup:
    enabled: true
    path: /api/actuator/health/liveness
    timeoutSeconds: 10
    failureThreshold: 120
  readiness:
    enabled: true
    path: /api/actuator/health/readiness
  liveness:
    enabled: true
    path: /api/actuator/health/liveness

serviceMonitor:
  enabled: true
  path: /api/actuator/prometheus

resources:
  requests:
    cpu: 50m
    memory: 384Mi
  limits:
    memory: 768Mi

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false
