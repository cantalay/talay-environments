# admin.conquest.cantalay.com/admin/v1 Ingress'inin sertifikası (Ingress TLS secret'ı kendi namespace'inde olmalı;
# panelin Ingress'i conquest-admin namespace'indeki conquest-admin-tls'i kullanır).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: conquest-admin-api-tls
  labels:
    app.kubernetes.io/name: conquest-api
    app.kubernetes.io/part-of: conquest
    talay.io/environment: prod
spec:
  secretName: conquest-admin-api-tls
  dnsNames:
    - admin.conquest.cantalay.com
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt
  usages:
    - digital signature
    - key encipherment
