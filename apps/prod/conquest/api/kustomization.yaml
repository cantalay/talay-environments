apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - certificate/certificate.yaml
  - certificate/site.yaml
  - ingress/ingress.yaml
  - ingress/site.yaml
  - ingress/legacy-site.yaml
  - middleware/legacy-site-redirect.yaml
  - alerts/prometheusrule.yaml

configMapGenerator:
  - name: conquest-api-dashboard
    files:
      - conquest.json=dashboard/dashboard.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: conquest

generatorOptions:
  disableNameSuffixHash: true
