# Oyun uçları (conquorer docs/42 §3.1, docs/69): API (/v1), gerçek zamanlı kanal (/hubs, WebSocket), yönetim paneli API'si
# (/admin/v1; Keycloak admin rolü, CORS yalnız https://admin.colonycon.art, docs/55) ve dış uptime için /health/live.
# api.colonycon.art asıl adrestir; api.conquest.cantalay.com yalnız eski istemci sürümleri için açık kalır (docs/69 §4).
# Herkese açık sayfalar (yasal, destek, hesap silme) colonycon.art'tadır: site.yaml. Eski host'taki sayfalar: legacy-site.yaml.
# /metrics (ServiceMonitor küme içinden kazır) dışarı açılmaz.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: conquest-api
  labels:
    app.kubernetes.io/name: conquest-api
    app.kubernetes.io/part-of: conquest
    talay.io/environment: prod
spec:
  ingressClassName: traefik
  tls:
    - secretName: conquest-api-tls
      hosts:
        - api.colonycon.art
        - api.conquest.cantalay.com
  rules:
    - host: api.colonycon.art
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: conquest-api
                port:
                  number: 80
          - path: /hubs
            pathType: Prefix
            backend:
              service:
                name: conquest-api
                port:
                  number: 80
          - path: /admin/v1
            pathType: Prefix
            backend:
              service:
                name: conquest-api
                port:
                  number: 80
          - path: /health/live
            pathType: Exact
            backend:
              service:
                name: conquest-api
                port:
                  number: 80
    - host: api.conquest.cantalay.com
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: conquest-api
                port:
                  number: 80
          - path: /hubs
            pathType: Prefix
            backend:
              service:
                name: conquest-api
                port:
                  number: 80
          - path: /admin/v1
            pathType: Prefix
            backend:
              service:
                name: conquest-api
                port:
                  number: 80
          - path: /health/live
            pathType: Exact
            backend:
              service:
                name: conquest-api
                port:
                  number: 80
