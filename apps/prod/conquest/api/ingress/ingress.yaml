# Yalnız oyun API'si (/v1), gerçek zamanlı kanal (/hubs, WebSocket), dış uptime için /health/live ve mağazaların istediği
# herkese açık sayfalar dışarı açılır (conquorer docs/42 §3.1): ana sayfa (/), gizlilik/koşullar (/legal), destek formu
# (/support), uygulamasız hesap silme (/account) ve yönetim paneli API'si (/admin/v1; Keycloak admin rolü, CORS yalnız
# https://admin.conquest.cantalay.com, docs/55). /metrics (ServiceMonitor küme içinden kazır) bu host'ta yoktur.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: conquest-api
  labels:
    app.kubernetes.io/name: conquest-api
    app.kubernetes.io/part-of: conquest
    talay.io/environment: prod
spec:
  ingressClassName: traefik
  tls:
    - secretName: conquest-api-tls
      hosts:
        - api.conquest.cantalay.com
  rules:
    - host: api.conquest.cantalay.com
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: conquest-api
                port:
                  number: 80
          - path: /hubs
            pathType: Prefix
            backend:
              service:
                name: conquest-api
                port:
                  number: 80
          - path: /admin/v1
            pathType: Prefix
            backend:
              service:
                name: conquest-api
                port:
                  number: 80
          - path: /health/live
            pathType: Exact
            backend:
              service:
                name: conquest-api
                port:
                  number: 80
          - path: /legal
            pathType: Prefix
            backend:
              service:
                name: conquest-api
                port:
                  number: 80
          - path: /support
            pathType: Exact
            backend:
              service:
                name: conquest-api
                port:
                  number: 80
          - path: /account/delete
            pathType: Exact
            backend:
              service:
                name: conquest-api
                port:
                  number: 80
          - path: /
            pathType: Exact
            backend:
              service:
                name: conquest-api
                port:
                  number: 80
