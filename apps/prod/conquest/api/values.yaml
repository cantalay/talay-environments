# Colony Conquest oyun sunucusu (cantalay/conquorer, docs/21): .NET 10 + Orleans, tek pod (api + silo + worker).
fullnameOverride: conquest-api
environment: prod
partOf: conquest
replicaCount: 1

image:
  repository: ghcr.io/cantalay/conquest-server
  tag: "sha-c98b4b7"
  digest: "sha256:f2f32800a32948224ee763d8db28cb256926ede79f2f03927a580bd3d870c677"
  pullPolicy: IfNotPresent

registrySecret:
  enabled: true
  remoteKey: platform/registry/ghcr
  targetName: ghcr-pull

# .NET: OTel SDK uygulamanın içinde; chart yalnız OTEL_* env'lerini verir (Java agent / Node enjeksiyonu yok).
runtime:
  type: other

containerPort: 8080

config:
  ASPNETCORE_ENVIRONMENT: Production
  Auth__Mode: Oidc
  KEYCLOAK_ISSUER_URL: https://auth.cantalay.com/realms/conquest
  KEYCLOAK_AUDIENCE: conquest-api
  # admin: yönetim paneli API'si /admin/v1 (docs/55). Tarayıcıdan yalnız panelin kökeni (app-standards §13, '*' yok).
  Conquest__Roles: api,silo,worker,admin
  CORS_ORIGINS: https://admin.conquest.cantalay.com
  # docs/56 §2.2: push. iOS → APNs (Vault APNS_AUTH_KEY + aşağıdaki kimlikler), Android → FCM (Vault FCM_SERVICE_ACCOUNT_JSON +
  # Push__Android__*). Anahtar yokken o platformun cihazları atlanır, oyun çalışır.
  Notifications__Sender: Platform
  Apns__BundleId: com.cantalay.colonyconquest
  Conquest__Orleans__Clustering: Localhost
  Conquest__Orleans__Storage: AdoNet
  DB_POOL_MAX: "8"
  # Paylaşımlı düğüm: iş istasyonu GC'si (sunucu GC'si 8 çekirdekte gereksiz bellek ayırır).
  DOTNET_gcServer: "0"
  DOTNET_GCConserveMemory: "5"
  # docs/41 §4: bulmaca üretimi CPU yoğun; pod'un CPU sınırı yok, paylaşımlı düğümde aynı anda en çok 3 üretim.
  Puzzles__MaxConcurrentGenerations: "3"

externalSecret:
  enabled: true
  remoteKey: apps/conquest/api
  targetName: conquest-api-secrets

observability:
  enabled: true
  serviceName: conquest-api
  metricsExporter: none        # metrikler /metrics üzerinden kazınır (ServiceMonitor)
  samplingRatio: "0.25"

probes:
  startup:
    enabled: true
    path: /health/startup
    failureThreshold: 60
    periodSeconds: 5
  readiness:
    enabled: true
    path: /health/ready
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    enabled: true
    path: /health/live
    initialDelaySeconds: 15
    periodSeconds: 20

serviceMonitor:
  enabled: true
  path: /metrics
  interval: 30s

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    # Faz 7 (docs/30 §12): yük testinde 2 dünya × 19 bot tepe RSS 589 MB; 919 bölgelik dünya ve çok aşamalı savaşlar.
    memory: 1Gi

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false
