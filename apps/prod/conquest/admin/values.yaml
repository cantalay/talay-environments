# Colony Conquest yönetim paneli (cantalay/conquest-admin, conquorer docs/55): React SPA. Arka ucu conquest-api'nin
# https://api.conquest.cantalay.com/admin/v1 ucudur (sunucu CORS_ORIGINS ile yalnız bu panelin kökenine izin verir).
fullnameOverride: conquest-admin
environment: prod
partOf: conquest
replicaCount: 1

image:
  repository: ghcr.io/cantalay/conquest-admin
  tag: "sha-453189e"
  digest: "sha256:2392adef67fdb2d4073e43fcfb91db4a7816ad2226c35c72984e81d1ded77c52"
  pullPolicy: IfNotPresent

registrySecret:
  enabled: true
  remoteKey: platform/registry/ghcr
  targetName: ghcr-pull

containerPort: 8080

runtimeConfig:
  API_URL: https://api.conquest.cantalay.com
  AUTH_URL: https://auth.cantalay.com
  AUTH_REALM: conquest
  ENVIRONMENT: prod

# Güvenlik başlıkları (CSP dahil) her location'da tekrar edilir: nginx, kendi add_header'ı olan location'a sunucu
# seviyesindekileri miras vermez (PLATFORM.md §11).
nginx:
  existingConfigMap: conquest-admin-nginx
  configRevision: "2"

networkPolicy:
  enabled: true
  denyEgress: true

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 96Mi

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false
