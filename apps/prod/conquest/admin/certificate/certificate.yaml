apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: conquest-admin-tls
  labels:
    app.kubernetes.io/name: conquest-admin
    app.kubernetes.io/part-of: conquest
    talay.io/environment: prod
spec:
  secretName: conquest-admin-tls
  dnsNames:
    - admin.conquest.cantalay.com
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt
  usages:
    - digital signature
    - key encipherment
