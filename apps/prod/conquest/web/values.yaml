# Colony Conquest sitesi (conquorer web/, docs/69): durağan sayfa, https://colonycon.art (www ve eski colony.cantalay.com → 301).
# APK GitHub'daki herkese açık cantalay/colony-conquest-releases deposunda; /android ve /apk oraya yönlendirir (nginx/default.conf).
fullnameOverride: conquest-web
environment: prod
partOf: conquest
replicaCount: 1

image:
  repository: ghcr.io/cantalay/conquest-web
  tag: "sha-6e021f1"
  digest: "sha256:b805559ae4c91f60b4484448851e91f341e6d4522ea2abb7855e3f196ec7c879"
  pullPolicy: IfNotPresent

registrySecret:
  enabled: true
  remoteKey: platform/registry/ghcr
  targetName: ghcr-pull

containerPort: 8080

# /runtime-config.js (conquorer web/site/src/scripts/site.ts, docs/69 §2.1). Boş değer: rozet/e-posta gizli.
# IOS_URL ve GOOGLE_PLAY_URL mağaza sayfası yayına girince; e-postalar Mailgun kurulunca (docs/69 §5).
runtimeConfig:
  IOS_URL: ""
  GOOGLE_PLAY_URL: ""
  CONTACT_EMAIL: ""
  PRESS_EMAIL: ""

nginx:
  existingConfigMap: conquest-web-nginx
  configRevision: "3"

networkPolicy:
  enabled: true
  denyEgress: true

resources:
  requests:
    cpu: 5m
    memory: 16Mi
  limits:
    memory: 64Mi

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false
