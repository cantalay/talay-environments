# Colony Conquest sitesi, https://colonycon.art (conquorer web/site, docs/69): Astro ile üretilmiş durağan, çok dilli sayfalar
# (Türkçe kökte, /en/, /ar/). Yasal sayfalar, destek formu ve hesap silme aynı host'ta oyun sunucusundadır (Ingress
# conquest-api-site; Traefik uzun yolu önce eşler). APK GitHub'daki herkese açık colony-conquest-releases deposunda durur;
# /android ve /apk oraya yönlendirir (sunucu diski ve trafiği harcanmaz).
# Güvenlik başlıkları sunucu seviyesinde; kendi add_header'ı olan location'larda (yalnız /assets/) tekrar edilir, çünkü nginx
# o location'a sunucudakileri miras vermez (PLATFORM.md §11). Diğer yerlerde önbellek süresi expires ile verilir.
# CSP: satır içi betik/stil yok (web/site/scripts/check-dist.mjs denetler); tarayıcı yalnız api.github.com'a bağlanır
# (son APK'nın sürümü ve boyutu).

# Eski pazarlama adresleri ?lang= taşır (api.conquest.cantalay.com/?lang=en → 301 → /?lang=en): dilin kendi sayfasına.
map $arg_lang $conquest_lang_home {
  en      /en/;
  ar      /ar/;
  default "";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  absolute_redirect off;
  charset utf-8;
  charset_types text/css application/javascript application/xml text/plain application/manifest+json image/svg+xml;
  error_page 404 /404.html;

  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_types text/css application/javascript application/xml text/plain application/manifest+json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; media-src 'self'; manifest-src 'self'; connect-src 'self' https://api.github.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # Tek adres: www ve eski colony.cantalay.com kalıcı olarak colonycon.art'a (yol ve sorgu korunur). Sertifika üçünü de kapsar.
  # (Yalnız bu iki ad: kubelet yoklaması pod IP'siyle gelir, yönlenmemeli.)
  if ($host = "www.colonycon.art") {
    return 301 https://colonycon.art$request_uri;
  }
  if ($host = "colony.cantalay.com") {
    return 301 https://colonycon.art$request_uri;
  }

  if ($request_method !~ ^(GET|HEAD)$) {
    return 405;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # values.yaml runtimeConfig'ten (mağaza adresleri, iletişim e-postası); değişince hemen geçerli olsun.
  location = /runtime-config.js {
    expires epoch;
    try_files $uri =404;
  }

  # Kısa indirme bağlantıları: hep son APK.
  location ~ ^/(android|apk)/?$ {
    expires epoch;
    return 302 https://github.com/cantalay/colony-conquest-releases/releases/latest/download/ColonyConquest.apk;
  }

  # Kısa yasal adresler. Sayfaları oyun sunucusu üretir (/legal → conquest-api).
  location ~ ^/(privacy|terms|community|kvkk)/?$ {
    return 301 /legal/$1$is_args$args;
  }

  location = / {
    if ($conquest_lang_home != "") {
      return 301 $conquest_lang_home;
    }
    expires epoch;
    try_files /index.html =404;
  }

  # Astro'nun hash'li çıktıları: içerik değişince adı da değişir.
  location /assets/ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; media-src 'self'; manifest-src 'self'; connect-src 'self' https://api.github.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Sabit adresli görseller (paylaşım görseli, simgeler, videolar): adres aynı kalır, bir hafta önbellek.
  location ~ ^/(og|icons|media)/ {
    expires 7d;
    try_files $uri =404;
  }

  location ~ ^/(robots\.txt|sitemap\.xml|site\.webmanifest|favicon\.ico)$ {
    expires 1h;
    try_files $uri =404;
  }

  # Sayfalar: /about ve /about/ aynı dosya (kanonik adres sonda /). HTML her istekte yeniden doğrulanır.
  location / {
    expires epoch;
    try_files $uri $uri/index.html =404;
  }
}
