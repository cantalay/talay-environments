# Colony Conquest indirme sayfası (conquorer web/download, docs/42 §7.4). Durağan sayfa; APK GitHub'daki herkese açık
# cantalay/colony-conquest-releases deposunda durur, /android ve /apk oraya yönlendirir (sunucu diski ve trafiği harcanmaz).
# Güvenlik başlıkları yalnız sunucu seviyesinde: location'larda add_header yok (olsa sunucudakiler miras kalmazdı), önbellek
# süresi expires ile verilir. Sayfa yalnız api.github.com'a bağlanır (son sürümün numarası ve boyutu).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  absolute_redirect off;
  charset utf-8;

  gzip on;
  gzip_types text/css application/javascript;
  gzip_min_length 512;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src https://api.github.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;

  if ($request_method !~ ^(GET|HEAD)$) {
    return 405;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Kısa indirme bağlantıları: hep son APK.
  location ~ ^/(android|apk)/?$ {
    expires epoch;
    return 302 https://github.com/cantalay/colony-conquest-releases/releases/latest/download/ColonyConquest.apk;
  }

  location /assets/ {
    expires 7d;
    try_files $uri =404;
  }

  location / {
    expires epoch;
    try_files $uri $uri/ @home;
  }

  location @home {
    return 302 /;
  }
}
