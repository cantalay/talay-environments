fullnameOverride: finance-follower-fe
environment: prod
partOf: finance-follower
replicaCount: 2

image:
  repository: ghcr.io/cantalay/finance-follower-fe
  tag: sha-001ad4e
  pullPolicy: IfNotPresent

registrySecret:
  enabled: true
  remoteKey: platform/registry/ghcr
  targetName: finance-follower-fe-ghcr-pull

runtimeConfig:
  EXPO_PUBLIC_API_URL: https://finance-api.cantalay.com/api
  EXPO_PUBLIC_OIDC_ISSUER: https://auth.cantalay.com/realms/finance-follower
  EXPO_PUBLIC_OIDC_CLIENT_ID: finance-follower-fe

securityHeaders:
  contentSecurityPolicy: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; frame-src https://auth.cantalay.com; form-action 'self' https://auth.cantalay.com; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://auth.cantalay.com https://finance-api.cantalay.com"
  strictTransportSecurity: max-age=31536000; includeSubDomains
  permissionsPolicy: camera=(), microphone=(), geolocation=(), payment=()
  referrerPolicy: strict-origin-when-cross-origin
  xFrameOptions: DENY

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 75

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  denyEgress: true

ingress:
  enabled: true
  hosts:
    - host: finance.cantalay.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: finance-follower-fe-tls
      hosts:
        - finance.cantalay.com
