apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: auth-gateway-tls
  labels:
    app.kubernetes.io/name: auth-gateway
    app.kubernetes.io/part-of: todogi
    talay.io/environment: prod
spec:
  secretName: auth-gateway-tls
  dnsNames:
    - auth.cantalay.com
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt
  usages:
    - digital signature
    - key encipherment
