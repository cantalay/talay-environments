apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: notify-api-tls
  labels:
    app.kubernetes.io/name: notify-api
    app.kubernetes.io/part-of: notify
    talay.io/environment: prod
spec:
  secretName: notify-api-tls
  dnsNames:
    - api.notify.cantalay.com
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt
  usages:
    - digital signature
    - key encipherment
