# Notify yönetim paneli (cantalay/notify web/): React SPA. Arka ucu https://api.notify.cantalay.com/admin/v1 (sunucu
# CORS_ORIGINS ile yalnız bu panelin kökenine izin verir); giriş auth-gateway /auth/notify.
fullnameOverride: notify-web
environment: prod
partOf: notify
replicaCount: 1

image:
  repository: ghcr.io/cantalay/notify-web
  tag: "sha-175501f"
  digest: "sha256:e498b79644b8ffdf13ff6142ed4bc1dd072bbcef43e70deab6c41d5236cba301"
  pullPolicy: IfNotPresent

registrySecret:
  enabled: true
  remoteKey: platform/registry/ghcr
  targetName: ghcr-pull

containerPort: 8080

runtimeConfig:
  API_URL: https://api.notify.cantalay.com
  AUTH_URL: https://auth.cantalay.com
  AUTH_REALM: notify
  GRAFANA_URL: https://grafana.cantalay.com

# Güvenlik başlıkları ve CSP kendi nginx yapılandırmasında (nginx/default.conf): chart'ın varsayılanı location'larda
# başlıkları kaybediyor.
nginx:
  existingConfigMap: notify-web-nginx
  configRevision: "1"

networkPolicy:
  enabled: true
  denyEgress: true

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 96Mi

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false
