# ToDoGi API (cantalay/todogi-be, docs/09-api.md): REST /v1/*, WebSocket /v1/ws, /v1/app/config; ileride OTA /updates/*.
# NestJS 12 + Fastify, Node 24. Migration'ları açılışta advisory lock ile kendisi koşar (D4, RUN_MIGRATIONS). Worker aynı
# imajı TODOGI_PROCESS_TYPE=worker ile çalıştırır. Giriş auth-gateway üzerinden (realm todogi, istemci auth).
fullnameOverride: todogi-api
environment: prod
partOf: todogi
replicaCount: 1

image:
  repository: ghcr.io/cantalay/todogi-server
  tag: "sha-4d10d12"
  digest: "sha256:991f18e965b64576dbdfeac6c3c956c815e7a5d3481d175cd1e9a940215ac56a"
  pullPolicy: IfNotPresent

registrySecret:
  enabled: true
  remoteKey: platform/registry/ghcr
  targetName: ghcr-pull

runtime:
  type: node
  node:
    autoInstrumentation:
      enabled: true

containerPort: 8080

config:
  NODE_ENV: production
  TODOGI_PROCESS_TYPE: api
  RUN_MIGRATIONS: "true"
  KEYCLOAK_ISSUER_URL: https://auth.cantalay.com/realms/todogi
  KEYCLOAK_AUDIENCE: todogi-api
  # Gateway'in varsayılan realm istemcisi (import edilen eski ad; ileride todogi-gateway'e taşınabilir).
  KEYCLOAK_ALLOWED_AZP: auth
  AUTH_GATEWAY_URL: https://auth.cantalay.com/auth/todogi
  CORS_ORIGINS: https://todogi.net
  PUBLIC_API_URL: https://api.todogi.net
  # İP-20 hesap silme: bekleme yok (girişli akış hemen siler); KVKK formu bu kutuya (D11 yönlendirmesi ürün sahibinde)
  ACCOUNT_DELETION_GRACE_DAYS: "0"
  KVKK_INBOX_EMAIL: kvkk@todogi.net
  PUBLIC_WEB_URL: https://todogi.net
  NOTIFY_INTERNAL_URL: http://notify-api-internal.notify-api.svc.cluster.local
  APP_MIN_VERSION_IOS: "1.0.0"
  APP_MIN_VERSION_ANDROID: "1.0.0"
  APP_LATEST_VERSION_IOS: "1.0.0"
  APP_LATEST_VERSION_ANDROID: "1.0.0"
  MAINTENANCE_ENABLED: "false"
  # Web istemcisinin BUILD_ID'siyle aynı tutulur (webapp values runtimeConfig.BUILD_ID): farklıysa "yeni sürüm hazır" şeridi.
  WEB_BUILD_ID: "sha-fd51b16"
  UPDATES_ENABLED: "false"
  # İP-16: borç araçları, varlıklar (kur servisi ilk çekimden sonra görünür), yıllık şablonlar
  APP_FLAGS: '{"finance.debtTools":true,"finance.assets":true,"finance.annualTemplates":true}'
  OTEL_NODE_DISABLED_INSTRUMENTATIONS: fs,dns,net
  OTEL_NODE_RESOURCE_DETECTORS: env,host,os,process,serviceinstance

# Vault'a yeni sır eklenince pod env'i yenilensin diye artırılır (ExternalSecret secret'ı günceller ama pod yeniden başlamaz).
podAnnotations:
  talay.io/secrets-rev: "2026-11-24-notify"

externalSecret:
  enabled: true
  remoteKey: apps/todogi/api
  targetName: todogi-api-secrets

observability:
  enabled: true
  serviceName: todogi-api
  samplingRatio: "0.25"

probes:
  startup:
    enabled: true
    path: /health/startup
    failureThreshold: 30
    periodSeconds: 2
  readiness:
    enabled: true
    path: /health/ready
    periodSeconds: 10
  liveness:
    enabled: true
    path: /health/live
    periodSeconds: 20

serviceMonitor:
  enabled: true
  path: /metrics
  interval: 30s

ingress:
  enabled: false

# Sürümde istek (ve WebSocket yeniden bağlanması) düşmesin: yeni pod hazır olmadan eskisi kapanmaz.
rollingUpdate:
  maxSurge: 1
  maxUnavailable: 0
preStopSleepSeconds: 5

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false
