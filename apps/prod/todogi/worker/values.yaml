# ToDoGi worker (api ile aynı imaj, TODOGI_PROCESS_TYPE=worker): ay kapanışı, kur yenileme, bildirim zamanlayıcı,
# hesap silme, davet süresi, outbox yayını, temizlik. Ingress yok; migration yok (api koşar). Sağlık uçları yalnız probe/metrics.
# notify-api (8081) ve financefollower-api çıkışları karşı tarafların NetworkPolicy'sinde İP-19/İP-17'de açılır.
fullnameOverride: todogi-worker
environment: prod
partOf: todogi
replicaCount: 1

image:
  repository: ghcr.io/cantalay/todogi-server
  tag: "sha-ca81656"
  digest: "sha256:ec01a0d51b2b3833919842f9de2246d516bec8ba4f2bb7333001dab7a13704b4"
  pullPolicy: IfNotPresent

registrySecret:
  enabled: true
  remoteKey: platform/registry/ghcr
  targetName: ghcr-pull

runtime:
  type: node
  node:
    autoInstrumentation:
      enabled: true

containerPort: 8080

config:
  NODE_ENV: production
  TODOGI_PROCESS_TYPE: worker
  RUN_MIGRATIONS: "false"
  PUBLIC_WEB_URL: https://todogi.net
  PUBLIC_API_URL: https://api.todogi.net
  # İP-20 hesap silme: Keycloak kullanıcısını yönetim API'siyle siler (talay-identity todogi-worker, yalnız manage-users;
  # sır Vault apps/todogi/worker KEYCLOAK_ADMIN_CLIENT_SECRET). Yedek saklama süresi silme e-postası metninde geçer.
  KEYCLOAK_ISSUER_URL: https://auth.cantalay.com/realms/todogi
  KEYCLOAK_ADMIN_CLIENT_ID: todogi-worker
  BACKUP_RETENTION_DAYS: "30"
  NOTIFY_INTERNAL_URL: http://notify-api-internal.notify-api.svc.cluster.local
  RATES_URL: http://financefollower-api.financefollower-api.svc.cluster.local/api
  RATES_REFRESH_SECONDS: "900"
  RATES_STALE_AFTER_SECONDS: "86400"
  RATES_TIMEOUT_MS: "5000"
  RATES_ALWAYS_CODES: USD,EUR,XAU_G24,XAU_CEYREK
  OTEL_NODE_DISABLED_INSTRUMENTATIONS: fs,dns,net
  OTEL_NODE_RESOURCE_DETECTORS: env,host,os,process,serviceinstance

# Vault'a yeni sır eklenince pod env'i yenilensin diye artırılır (ExternalSecret secret'ı günceller ama pod yeniden başlamaz).
podAnnotations:
  talay.io/secrets-rev: "2026-11-24-notify"

externalSecret:
  enabled: true
  remoteKey: apps/todogi/worker
  targetName: todogi-worker-secrets

observability:
  enabled: true
  serviceName: todogi-worker
  samplingRatio: "0.10"

probes:
  startup:
    enabled: true
    path: /health/startup
    # Worker, api'nin migration'ı uygulamasını bekler (api yeni pod'a geçene kadar 1–3 dk); 60 sn'de öldürülmesin.
    failureThreshold: 150
    periodSeconds: 2
  readiness:
    enabled: true
    path: /health/ready
    periodSeconds: 10
  liveness:
    enabled: true
    path: /health/live
    periodSeconds: 20

serviceMonitor:
  enabled: true
  path: /metrics
  interval: 30s

ingress:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 192Mi
  limits:
    memory: 384Mi

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false
