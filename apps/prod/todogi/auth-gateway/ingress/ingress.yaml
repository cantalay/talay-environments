apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth-gateway
  labels:
    app.kubernetes.io/name: auth-gateway
    app.kubernetes.io/part-of: todogi
    talay.io/environment: prod
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: gateway-auth-gateway-ratelimit@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - secretName: auth-gateway-tls
      hosts:
        - auth.cantalay.com
    - secretName: auth-gateway-telatv-tls
      hosts:
        - auth.telatv.net
    - secretName: auth-gateway-colonycon-tls
      hosts:
        - auth.colonycon.art
  rules:
    - host: auth.cantalay.com
      http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: auth-gateway
                port:
                  number: 80
    - host: auth.telatv.net
      http:
        paths:
          - path: /auth/tela
            pathType: Prefix
            backend:
              service:
                name: auth-gateway
                port:
                  number: 80
    # Colony Conquest'in kendi alan adı (conquorer docs/69): bu host yalnız conquest realm'inin gateway uçlarını açar.
    # Token issuer'ı Keycloak'ın adresi olarak kalır (https://auth.cantalay.com/realms/conquest); oyuncu bunu görmez.
    - host: auth.colonycon.art
      http:
        paths:
          - path: /auth/conquest
            pathType: Prefix
            backend:
              service:
                name: auth-gateway
                port:
                  number: 80
