fullnameOverride: auth-gateway
environment: prod
replicaCount: 1

image:
  repository: ghcr.io/cantalay/todogi-auth-gateway
  tag: "sha-f92c65a"
  pullPolicy: IfNotPresent

registrySecret:
  enabled: true
  remoteKey: platform/registry/ghcr
  targetName: ghcr-pull

runtime:
  type: java
  java:
    agent:
      enabled: false

containerPort: 8080

config:
  SERVER_PORT: "8080"
  CORS_ALLOWED_ORIGINS: https://todogi.singlestranger.com,https://www.todogi.singlestranger.com

externalSecret:
  enabled: true
  remoteKey: apps/todogi/keycloak
  targetName: auth-gateway-secrets

observability:
  enabled: true
  serviceName: auth-gateway
  otlpProtocol: http/protobuf
  logsExporter: none
  samplingRatio: "0.25"

probes:
  startup:
    enabled: true
    path: /actuator/health
  readiness:
    enabled: true
    path: /actuator/health
  liveness:
    enabled: true
    path: /actuator/health

serviceMonitor:
  enabled: true
  path: /actuator/prometheus

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false
