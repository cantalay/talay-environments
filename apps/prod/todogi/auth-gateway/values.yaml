fullnameOverride: auth-gateway
environment: prod
replicaCount: 1

image:
  repository: ghcr.io/cantalay/todogi-auth-gateway
  tag: "sha-006cdb0"
  digest: "sha256:3239e74be4df0811d2162e97f771b9b25f1685faa23eb4223f65a502df66affc"
  pullPolicy: IfNotPresent

registrySecret:
  enabled: true
  remoteKey: platform/registry/ghcr
  targetName: ghcr-pull

runtime:
  type: java
  java:
    agent:
      enabled: false

containerPort: 8080

# Gateway'in hizmet verdiği ek realm'ler (Vault kv/apps/todogi/keycloak GATEWAY_REALMS_<REALM>_ADMINCLIENTSECRET).
# Env yalnız başlangıçta okunur: realm eklerken bu listeyi güncellemek rollout'u tetikler.
podAnnotations:
  talay.io/gateway-realms: "vitafinder,financefollower,conquest,notify,tela"
  # Sunucu ağı 25/465/587 çıkışını kapatıyor; SMTP2GO 2525 + STARTTLS (Vault apps/todogi/keycloak SMTP_*).
  # Vault'taki SMTP değişince bu değer artırılır (env yalnız açılışta okunur).
  talay.io/smtp-config: "2026-11-23-2525"

config:
  SERVER_PORT: "8080"
  # Colony Conquest: mobil oturum offline token (talay-identity offline_access) ve Game Center / Play Games girişi
  # (/auth/conquest/platform; talay-identity platform_identity + talay-keycloak-providers).
  GATEWAY_REALMS_CONQUEST_OFFLINEACCESS: "true"
  GATEWAY_REALMS_CONQUEST_PLATFORMLOGIN: "true"
  # Varsayılan realm (todogi): mobil uzun oturum için offline token (İP-04).
  KEYCLOAK_OFFLINE_ACCESS: "true"
  # Giriş yöntemleri (GET/DELETE /auth/todogi/identities, /social mode=link) yalnız varsayılan realm (todogi) için.
  KEYCLOAK_IDENTITY_METHODS: "true"
  # Kayıt sınırı tüm realm'lerde (varsayılan IP başına 20/saat); mobil CGNAT'ta ortak IP'li oyuncular için 60.
  GATEWAY_REGISTER_LIMIT_PER_IP: "60"
  # ToDoGi hesap e-postaları (SMTP_* ve GATEWAY_ACTION_TOKEN_SECRETS Vault apps/todogi/keycloak'ta).
  GATEWAY_MAIL_REALMS_TODOGI_FROMNAME: "ToDoGi"
  GATEWAY_MAIL_REALMS_TODOGI_APPNAME: "ToDoGi"
  GATEWAY_MAIL_REALMS_TODOGI_APPURL: "https://todogi.net"
  GATEWAY_MAIL_REALMS_TODOGI_LOCALES: "tr,en"
  GATEWAY_MAIL_REALMS_TODOGI_DEFAULTLOCALE: "tr"
  # İP-06a ekranları canlıda (todogi-webapp sha-447d821): gateway e-postaları açık; Keycloak doğrulama e-postası kullanılmaz.
  GATEWAY_MAIL_REALMS_TODOGI_FROM: "noreply@todogi.net"
  GATEWAY_MAIL_REALMS_TODOGI_RESETURL: "https://todogi.net/reset-password"
  GATEWAY_MAIL_REALMS_TODOGI_VERIFYURL: "https://todogi.net/verify-email"
  CORS_ALLOWED_ORIGINS: "https://todogi.net,https://vita-pick.com,https://admin.vita-pick.com,https://finance.cantalay.com,https://admin.colonycon.art,https://notify.cantalay.com,https://telatv.net,https://admin.telatv.net,https://tela.cantalay.com,https://admin.tela.cantalay.com"

externalSecret:
  enabled: true
  remoteKey: apps/todogi/keycloak
  targetName: auth-gateway-secrets

observability:
  enabled: true
  serviceName: auth-gateway
  otlpProtocol: http/protobuf
  logsExporter: none
  samplingRatio: "0.25"

probes:
  # JVM açılışı CPU steal altında dakikalar sürebiliyor; 150 sn'lik varsayılan restart döngüsüne sokuyordu.
  startup:
    enabled: true
    path: /actuator/health
    timeoutSeconds: 10
    failureThreshold: 120
  readiness:
    enabled: true
    path: /actuator/health
  liveness:
    enabled: true
    path: /actuator/health

serviceMonitor:
  enabled: true
  path: /actuator/prometheus

# Tek replika: sürümde yeni pod hazır olmadan eskisi kapanmaz (2026-11-22 sha-b0764fc geçişinde ~45 sn tüm realm'lerde giriş kesildi).
rollingUpdate:
  maxSurge: 1
  maxUnavailable: 0
preStopSleepSeconds: 5

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false
