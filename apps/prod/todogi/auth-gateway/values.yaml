fullnameOverride: auth-gateway
environment: prod
replicaCount: 1

image:
  repository: ghcr.io/cantalay/todogi-auth-gateway
  tag: "sha-028fee2"
  digest: "sha256:25785b4dc157e714582d752940c62489ec77d41b093be955cf733d645053599b"
  pullPolicy: IfNotPresent

registrySecret:
  enabled: true
  remoteKey: platform/registry/ghcr
  targetName: ghcr-pull

runtime:
  type: java
  java:
    agent:
      enabled: false

containerPort: 8080

# Gateway'in hizmet verdiği ek realm'ler (Vault kv/apps/todogi/keycloak GATEWAY_REALMS_<REALM>_ADMINCLIENTSECRET).
# Env yalnız başlangıçta okunur: realm eklerken bu listeyi güncellemek rollout'u tetikler.
podAnnotations:
  talay.io/gateway-realms: "vitafinder,financefollower,conquest,notify,tela"

config:
  SERVER_PORT: "8080"
  # Colony Conquest: mobil oturum offline token (talay-identity offline_access) ve Game Center / Play Games girişi
  # (/auth/conquest/platform; talay-identity platform_identity + talay-keycloak-providers).
  GATEWAY_REALMS_CONQUEST_OFFLINEACCESS: "true"
  GATEWAY_REALMS_CONQUEST_PLATFORMLOGIN: "true"
  CORS_ALLOWED_ORIGINS: "https://todogi.singlestranger.com,https://www.todogi.singlestranger.com,https://vita-pick.com,https://admin.vita-pick.com,https://finance.cantalay.com,https://admin.conquest.cantalay.com,https://notify.cantalay.com,https://tela.cantalay.com,https://admin.tela.cantalay.com"

externalSecret:
  enabled: true
  remoteKey: apps/todogi/keycloak
  targetName: auth-gateway-secrets

observability:
  enabled: true
  serviceName: auth-gateway
  otlpProtocol: http/protobuf
  logsExporter: none
  samplingRatio: "0.25"

probes:
  # JVM açılışı CPU steal altında dakikalar sürebiliyor; 150 sn'lik varsayılan restart döngüsüne sokuyordu.
  startup:
    enabled: true
    path: /actuator/health
    timeoutSeconds: 10
    failureThreshold: 120
  readiness:
    enabled: true
    path: /actuator/health
  liveness:
    enabled: true
    path: /actuator/health

serviceMonitor:
  enabled: true
  path: /actuator/prometheus

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false
