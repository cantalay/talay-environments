fullnameOverride: auth-gateway
environment: prod
replicaCount: 1

image:
  repository: ghcr.io/cantalay/todogi-auth-gateway
  tag: "sha-b7d7393"
  digest: "sha256:b8a13f4d66f339471a8f1b2c87870a4233689ab1bbda580f95be7886f875f768"
  pullPolicy: IfNotPresent

registrySecret:
  enabled: true
  remoteKey: platform/registry/ghcr
  targetName: ghcr-pull

runtime:
  type: java
  java:
    agent:
      enabled: false

containerPort: 8080

# Gateway'in hizmet verdiği ek realm'ler (Vault kv/apps/todogi/keycloak GATEWAY_REALMS_<REALM>_ADMINCLIENTSECRET).
# Env yalnız başlangıçta okunur: realm eklerken bu listeyi güncellemek rollout'u tetikler.
podAnnotations:
  talay.io/gateway-realms: "vitafinder,financefollower"

config:
  SERVER_PORT: "8080"
  CORS_ALLOWED_ORIGINS: "https://todogi.singlestranger.com,https://www.todogi.singlestranger.com,https://vita-pick.com,https://admin.vita-pick.com,https://finance.cantalay.com"

externalSecret:
  enabled: true
  remoteKey: apps/todogi/keycloak
  targetName: auth-gateway-secrets

observability:
  enabled: true
  serviceName: auth-gateway
  otlpProtocol: http/protobuf
  logsExporter: none
  samplingRatio: "0.25"

probes:
  # JVM açılışı CPU steal altında dakikalar sürebiliyor; 150 sn'lik varsayılan restart döngüsüne sokuyordu.
  startup:
    enabled: true
    path: /actuator/health
    timeoutSeconds: 10
    failureThreshold: 120
  readiness:
    enabled: true
    path: /actuator/health
  liveness:
    enabled: true
    path: /actuator/health

serviceMonitor:
  enabled: true
  path: /actuator/prometheus

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false
