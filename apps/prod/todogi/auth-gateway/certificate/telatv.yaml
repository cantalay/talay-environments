# telatv.net adları ayrı sertifikada: eski adın sertifikası yenilenmeye devam eder (geçiş süresince ikisi de sunulur)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: auth-gateway-telatv-tls
  labels:
    app.kubernetes.io/name: auth-gateway
    app.kubernetes.io/part-of: todogi
    talay.io/environment: prod
spec:
  secretName: auth-gateway-telatv-tls
  dnsNames:
    - auth.telatv.net
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt
  usages:
    - digital signature
    - key encipherment
