apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: todogi-webapp-tls
  labels:
    app.kubernetes.io/name: todogi-webapp
    app.kubernetes.io/part-of: todogi
    talay.io/environment: prod
spec:
  secretName: todogi-webapp-tls
  dnsNames:
    - todogi.net
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt
  usages:
    - digital signature
    - key encipherment
