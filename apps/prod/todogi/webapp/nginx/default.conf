# ToDoGi webapp (talay-web, nginx-unprivileged 8080). Kaynak: İP-03 §I.3; yerel test kopyası todogi-app
# deploy/nginx.default.conf (web-smoke). add_header kullanan HER location sunucu düzeyindeki başlıkları yeniden yazar
# (nginx miras kuralı, PLATFORM.md §11) → güvenlik başlıkları her location'da tekrar edilir.
server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }

  # 'unsafe-inline' yalnız stil: react-native-web çalışma zamanında <style> enjekte eder.
  set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api.todogi.net; font-src 'self'; connect-src 'self' https://api.todogi.net wss://api.todogi.net https://auth.cantalay.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";
  set $hsts "max-age=31536000; includeSubDomains";
  set $pp "camera=(), microphone=(self), geolocation=(), payment=()";

  add_header Strict-Transport-Security $hsts always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy $pp always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Content-Security-Policy $csp always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  location = /runtime-config.js {
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security $hsts always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy $pp always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy $csp always;
  }

  # iOS Universal Links / Android App Links (İP-21 §2.8 yol tablosu). Team ID ve Android imza parmak izi İP-23'te gelir;
  # o zamana kadar yer tutucu (yanlış Team ID zararsızdır: hiçbir uygulama eşleşmez).
  location = /.well-known/apple-app-site-association {
    default_type application/json;
    add_header Cache-Control "public, max-age=3600" always;
    add_header Strict-Transport-Security $hsts always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy $pp always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy $csp always;
    return 200 '{"applinks":{"details":[{"appIDs":["TEAMID.com.cantalay.todogi"],"components":[{"/":"/giris/geri","exclude":true},{"/":"/hesap-sil*","exclude":true},{"/":"/gizlilik","exclude":true},{"/":"/kvkk","exclude":true},{"/":"/kosullar","exclude":true},{"/":"/.well-known/*","exclude":true},{"/":"/gorevler/*"},{"/":"/listeler/*"},{"/":"/finans/*"},{"/":"/davet/*"},{"/":"/katil"},{"/":"/profil/*"},{"/":"/sifre-sifirla"},{"/":"/eposta-onay"}]}]},"webcredentials":{"apps":["TEAMID.com.cantalay.todogi"]}}';
  }

  location = /.well-known/assetlinks.json {
    default_type application/json;
    add_header Cache-Control "public, max-age=3600" always;
    add_header Strict-Transport-Security $hsts always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy $pp always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy $csp always;
    return 200 '[]';
  }

  location ^~ /_expo/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Strict-Transport-Security $hsts always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    try_files $uri =404;
  }

  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Strict-Transport-Security $hsts always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    try_files $uri =404;
  }

  # Belirteç taşıyan sayfalar başka siteye Referer sızdırmasın (belirteç #t= parçasında, yine de).
  location ~ ^/(sifre-sifirla|eposta-onay|davet/) {
    add_header Cache-Control "no-cache" always;
    add_header Strict-Transport-Security $hsts always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy $pp always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy $csp always;
    # Son argüman olmayan dosya bu location'da sunulur; "/index.html" son argüman olsaydı iç yönlendirme location /'a
    # düşer ve no-referrer kaybolurdu.
    try_files /index.html =404;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    add_header Strict-Transport-Security $hsts always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy $pp always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy $csp always;
    try_files $uri $uri/ /index.html;
  }
}
