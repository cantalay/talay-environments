# ToDoGi web (cantalay/todogi-app, Expo web export): SPA; API https://api.todogi.net, giriş auth-gateway /auth/todogi.
# Güvenlik başlıkları, CSP, SPA dönüşü ve /.well-known (iOS/Android uygulama bağlantıları) nginx/default.conf'ta.
fullnameOverride: todogi-webapp
environment: prod
partOf: todogi
replicaCount: 1

image:
  repository: ghcr.io/cantalay/todogi-web
  tag: "sha-8033c6b"
  digest: "sha256:c621e03e09789cb62f3864a5a5a614b7a6c8e4963735a62bf7aa383a9bdfdb3a"
  pullPolicy: IfNotPresent

registrySecret:
  enabled: true
  remoteKey: platform/registry/ghcr
  targetName: ghcr-pull

containerPort: 8080

runtimeConfig:
  API_URL: https://api.todogi.net
  WS_URL: wss://api.todogi.net/v1/ws
  AUTH_URL: https://auth.cantalay.com
  AUTH_REALM: todogi
  BUILD_ID: "sha-8033c6b"

nginx:
  existingConfigMap: todogi-webapp-nginx
  configRevision: "3"

networkPolicy:
  enabled: true
  denyEgress: true

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 64Mi

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false
