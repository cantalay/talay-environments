apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - certificate/certificate.yaml
  - ingress/ingress.yaml

configMapGenerator:
  - name: todogi-expo-app-nginx
    files:
      - default.conf=nginx/default.conf

generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/name: todogi-web
    app.kubernetes.io/part-of: todogi
    talay.io/environment: prod
