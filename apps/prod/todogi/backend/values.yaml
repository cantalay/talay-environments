fullnameOverride: todogi-be
environment: prod
replicaCount: 1

image:
  repository: ghcr.io/cantalay/todogi-api
  tag: "sha-91ef01e"
  pullPolicy: IfNotPresent

registrySecret:
  enabled: true
  remoteKey: platform/registry/ghcr
  targetName: ghcr-pull

runtime:
  type: java
  java:
    agent:
      enabled: true

containerPort: 8080

config:
  SPRING_PROFILES_ACTIVE: prod
  SERVER_PORT: "8080"
  CORS_ALLOWED_ORIGINS: https://todogi.singlestranger.com,https://www.todogi.singlestranger.com

externalSecret:
  enabled: true
  remoteKey: apps/todogi/backend
  targetName: todogi-backend-secrets

observability:
  enabled: true
  serviceName: todogi-be
  samplingRatio: "0.25"

probes:
  # JVM açılışı CPU steal altında dakikalar sürebiliyor; 150 sn'lik varsayılan restart döngüsüne sokuyordu.
  startup:
    enabled: true
    path: /actuator/health
    timeoutSeconds: 10
    failureThreshold: 120
  readiness:
    enabled: true
    path: /actuator/health
  liveness:
    enabled: true
    path: /actuator/health

serviceMonitor:
  enabled: true
  path: /actuator/prometheus

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false
