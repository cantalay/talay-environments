# Tela izleyici web (telatv.net; eski tela.cantalay.com buraya yönlenir). Tek imaj (cantalay/tela-web) iki kökü taşır:
# /usr/share/nginx/html/{web,admin}; index.html /runtime-config.js'i kendisi yükler.
fullnameOverride: tela-web
environment: prod
partOf: tela
replicaCount: 1

image:
  repository: ghcr.io/cantalay/tela-web
  tag: "sha-51b7c92"
  digest: "sha256:a805a46b0787225625bc3f3c5ff39dceb311780f1b7e4b13a6caaf1dd93784ad"
  pullPolicy: IfNotPresent

registrySecret:
  enabled: true
  remoteKey: platform/registry/ghcr
  targetName: ghcr-pull

containerPort: 8080
webRoot: /usr/share/nginx/html/web

runtimeConfig:
  APP: web
  API_URL: https://api.telatv.net
  AUTH_URL: https://auth.telatv.net
  AUTH_REALM: tela

nginx:
  existingConfigMap: tela-web-nginx
  configRevision: "3"

networkPolicy:
  enabled: true
  denyEgress: true

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false
