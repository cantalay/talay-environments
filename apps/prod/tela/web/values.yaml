# Tela izleyici web (tela.cantalay.com). Tek imaj (cantalay/tela-web) iki kökü taşır:
# /usr/share/nginx/html/{web,admin}; index.html /runtime-config.js'i kendisi yükler.
fullnameOverride: tela-web
environment: prod
partOf: tela
replicaCount: 1

image:
  repository: ghcr.io/cantalay/tela-web
  tag: "sha-69388c1"
  digest: "sha256:52c47e58fa1a7c6534dace1708791d2ab3fcb7665212caa3ea3fcd1bdfd531e5"
  pullPolicy: IfNotPresent

registrySecret:
  enabled: true
  remoteKey: platform/registry/ghcr
  targetName: ghcr-pull

containerPort: 8080
webRoot: /usr/share/nginx/html/web

runtimeConfig:
  APP: web
  API_URL: https://api.tela.cantalay.com
  AUTH_URL: https://auth.cantalay.com
  AUTH_REALM: tela

nginx:
  existingConfigMap: tela-web-nginx
  configRevision: "2"

networkPolicy:
  enabled: true
  denyEgress: true

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false
