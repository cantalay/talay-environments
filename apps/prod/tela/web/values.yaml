# Tela izleyici web (tela.cantalay.com). Tek imaj (cantalay/tela-web) iki kökü taşır:
# /usr/share/nginx/html/{web,admin}; index.html /runtime-config.js'i kendisi yükler.
fullnameOverride: tela-web
environment: prod
partOf: tela
replicaCount: 1

image:
  repository: ghcr.io/cantalay/tela-web
  tag: "sha-35d2444"
  digest: "sha256:11b8b46ec41bb828a709ed4fd4f95bc6b567e91c91ac3db513baf5f7732efa46"
  pullPolicy: IfNotPresent

registrySecret:
  enabled: true
  remoteKey: platform/registry/ghcr
  targetName: ghcr-pull

containerPort: 8080
webRoot: /usr/share/nginx/html/web

runtimeConfig:
  APP: web
  API_URL: https://api.tela.cantalay.com
  AUTH_URL: https://auth.cantalay.com
  AUTH_REALM: tela

nginx:
  existingConfigMap: tela-web-nginx
  configRevision: "2"

networkPolicy:
  enabled: true
  denyEgress: true

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false
