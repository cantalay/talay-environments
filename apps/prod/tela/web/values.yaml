# Tela izleyici web (tela.cantalay.com). Tek imaj (cantalay/tela-web) iki kökü taşır:
# /usr/share/nginx/html/{web,admin}; index.html /runtime-config.js'i kendisi yükler.
fullnameOverride: tela-web
environment: prod
partOf: tela
replicaCount: 1

image:
  repository: ghcr.io/cantalay/tela-web
  tag: "sha-654eaee"
  digest: "sha256:c3637dcb6e1303ec3cb84cd4cd98ef30b753a1dae45b912fc0e36b3b34fe22bb"
  pullPolicy: IfNotPresent

registrySecret:
  enabled: true
  remoteKey: platform/registry/ghcr
  targetName: ghcr-pull

containerPort: 8080
webRoot: /usr/share/nginx/html/web

runtimeConfig:
  APP: web
  API_URL: https://api.tela.cantalay.com
  AUTH_URL: https://auth.cantalay.com
  AUTH_REALM: tela

nginx:
  existingConfigMap: tela-web-nginx
  configRevision: "1"

networkPolicy:
  enabled: true
  denyEgress: true

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false
