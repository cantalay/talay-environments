# telatv.net adları ayrı sertifikada: eski adın sertifikası yenilenmeye devam eder (geçiş süresince ikisi de sunulur)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tela-admin-telatv-tls
  labels:
    app.kubernetes.io/name: tela-admin
    app.kubernetes.io/part-of: tela
    talay.io/environment: prod
spec:
  secretName: tela-admin-telatv-tls
  dnsNames:
    - admin.telatv.net
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt
  usages:
    - digital signature
    - key encipherment
