apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - certificate/certificate.yaml
  - ingress/ingress.yaml

configMapGenerator:
  - name: tela-admin-nginx
    files:
      - default.conf=nginx/default.conf

generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/name: tela-admin
    app.kubernetes.io/part-of: tela
    talay.io/environment: prod
