# Tela yönetim paneli (admin.telatv.net; eski admin.tela.cantalay.com buraya yönlenir). Tek imaj (cantalay/tela-web) iki kökü taşır:
# /usr/share/nginx/html/{web,admin}; index.html /runtime-config.js'i kendisi yükler.
fullnameOverride: tela-admin
environment: prod
partOf: tela
replicaCount: 1

image:
  repository: ghcr.io/cantalay/tela-web
  tag: "sha-fa2aee4"
  digest: "sha256:01648eadb07606eaebd848675d22ed00b6fd1be3fd252f7af8acdda956a9672e"
  pullPolicy: IfNotPresent

registrySecret:
  enabled: true
  remoteKey: platform/registry/ghcr
  targetName: ghcr-pull

containerPort: 8080
webRoot: /usr/share/nginx/html/admin

runtimeConfig:
  APP: admin
  API_URL: https://api.telatv.net
  AUTH_URL: https://auth.telatv.net
  AUTH_REALM: tela

nginx:
  existingConfigMap: tela-admin-nginx
  configRevision: "3"

networkPolicy:
  enabled: true
  denyEgress: true

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false
