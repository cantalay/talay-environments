# Tela yönetim paneli (admin.tela.cantalay.com). Tek imaj (cantalay/tela-web) iki kökü taşır:
# /usr/share/nginx/html/{web,admin}; index.html /runtime-config.js'i kendisi yükler.
fullnameOverride: tela-admin
environment: prod
partOf: tela
replicaCount: 1

image:
  repository: ghcr.io/cantalay/tela-web
  tag: "sha-fd0b5e9"
  digest: "sha256:375eba708eb75c8b7f1d00ec4d2d2fb0cdede1d8ed0f7e93787f54ac98f87b2c"
  pullPolicy: IfNotPresent

registrySecret:
  enabled: true
  remoteKey: platform/registry/ghcr
  targetName: ghcr-pull

containerPort: 8080
webRoot: /usr/share/nginx/html/admin

runtimeConfig:
  APP: admin
  API_URL: https://api.tela.cantalay.com
  AUTH_URL: https://auth.cantalay.com
  AUTH_REALM: tela

nginx:
  existingConfigMap: tela-admin-nginx
  configRevision: "1"

networkPolicy:
  enabled: true
  denyEgress: true

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false
