# Tela yönetim paneli (admin.tela.cantalay.com). Tek imaj (cantalay/tela-web) iki kökü taşır:
# /usr/share/nginx/html/{web,admin}; index.html /runtime-config.js'i kendisi yükler.
fullnameOverride: tela-admin
environment: prod
partOf: tela
replicaCount: 1

image:
  repository: ghcr.io/cantalay/tela-web
  tag: "sha-981e152"
  digest: "sha256:137667d19fa6d4b370351efc21ad9a6a82191014e98d7d47248f79257e91e5d8"
  pullPolicy: IfNotPresent

registrySecret:
  enabled: true
  remoteKey: platform/registry/ghcr
  targetName: ghcr-pull

containerPort: 8080
webRoot: /usr/share/nginx/html/admin

runtimeConfig:
  APP: admin
  API_URL: https://api.tela.cantalay.com
  AUTH_URL: https://auth.cantalay.com
  AUTH_REALM: tela

nginx:
  existingConfigMap: tela-admin-nginx
  configRevision: "1"

networkPolicy:
  enabled: true
  denyEgress: true

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false
