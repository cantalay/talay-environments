apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: tela-api-alerts
  labels:
    app.kubernetes.io/name: tela-api
    app.kubernetes.io/part-of: tela
    talay.io/environment: prod
spec:
  groups:
    - name: tela-api
      rules:
        - alert: TalayAppDown
          expr: sum(up{namespace="tela-api"}) == 0
          for: 5m
          labels: { severity: critical, project: tela }
          annotations:
            summary: "tela-api scrape hedefi 5 dakikadır ayakta değil"
        - alert: TalayAppCrashLooping
          expr: increase(kube_pod_container_status_restarts_total{namespace="tela-api"}[15m]) > 3
          labels: { severity: warning, project: tela }
          annotations:
            summary: "tela-api içinde pod 15 dakikada 3'ten fazla yeniden başladı"
        - alert: TalayAppHighErrorRate
          expr: |
            sum(rate(http_server_request_duration_seconds_count{k8s_namespace_name="tela-api",http_response_status_code=~"5.."}[5m]))
              / clamp_min(sum(rate(http_server_request_duration_seconds_count{k8s_namespace_name="tela-api"}[5m])), 1e-9) > 0.05
          for: 10m
          labels: { severity: warning, project: tela }
          annotations:
            summary: "tela-api 5xx oranı %5'in üzerinde"
        - alert: TalayAppSlow
          expr: histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{k8s_namespace_name="tela-api"}[5m]))) > 1
          for: 10m
          labels: { severity: warning, project: tela }
          annotations:
            summary: "tela-api p95 gecikme 1 saniyenin üzerinde"
        - alert: TelaSourceLoadFailing
          expr: |
            sum(rate(tela_sources_load_total{outcome!="ok"}[30m]))
              / clamp_min(sum(rate(tela_sources_load_total[30m])), 1e-9) > 0.5
            and sum(increase(tela_sources_load_total[30m])) > 10
          for: 30m
          labels: { severity: warning, project: tela }
          annotations:
            summary: "Kaynak (liste) yüklemelerinin yarısından fazlası 30 dakikadır başarısız"
            description: "Sağlayıcı engeli (veri merkezi IP), ağ çıkışı ya da ayrıştırıcı sorunu olabilir; outcome etiketine bak."
        - alert: TelaEpgLookupsFailing
          expr: |
            sum(rate(tela_epg_lookups_total{outcome="error"}[30m]))
              / clamp_min(sum(rate(tela_epg_lookups_total[30m])), 1e-9) > 0.8
            and sum(increase(tela_epg_lookups_total[30m])) > 50
          for: 30m
          labels: { severity: info, project: tela }
          annotations:
            summary: "EPG (şimdi/sonra) sorgularının %80'inden fazlası başarısız"
