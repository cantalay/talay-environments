# Tela API (cantalay/tela-core): politika/kill switch, client-config, hesap/profil, TV eşleştirme, kaynak önizleme
# (saklamasız), katalog okuma ve yönetim uçları. Migration'ları (ana şema + catalog şeması) yalnız bu çalıştırır.
# Katalog beslemesi catalog-worker'da (aynı imaj, TELA_CATALOG_INGEST=true).
fullnameOverride: tela-api
environment: prod
partOf: tela
replicaCount: 1

image:
  repository: ghcr.io/cantalay/tela-api
  tag: "sha-b69c559"
  digest: "sha256:61b58f1b519e8da5b34494639b10d47022b86c17e07f694e10515dd004778af0"
  pullPolicy: IfNotPresent

registrySecret:
  enabled: true
  remoteKey: platform/registry/ghcr
  targetName: ghcr-pull

runtime:
  type: java
  java:
    agent:
      enabled: true
    toolOptions: "-XX:MaxRAMPercentage=70"

containerPort: 8080

config:
  SPRING_PROFILES_ACTIVE: prod
  SERVER_PORT: "8080"
  DEPLOYMENT_ENVIRONMENT: prod
  KEYCLOAK_ISSUER_URI: https://auth.cantalay.com/realms/tela
  KEYCLOAK_AUDIENCE: tela-api
  CORS_ORIGINS: https://tela.cantalay.com,https://admin.tela.cantalay.com
  TELA_PAIR_URI: https://tela.cantalay.com/pair
  TELA_COUNTRY_HEADER: ""          # GeoIP başlığı veren kenar katmanı gelince (docs/01 §3)
  TELA_CATALOG_INGEST: "false"
  TELA_CATALOG_CONTACT: ops@cantalay.com
  DB_POOL_SIZE: "8"
  TELA_CATALOG_DB_POOL: "6"

externalSecret:
  enabled: true
  remoteKey: apps/tela/api
  targetName: tela-api-secrets

observability:
  enabled: true
  serviceName: tela-api
  samplingRatio: "0.25"

probes:
  startup:
    enabled: true
    path: /actuator/health/liveness
    failureThreshold: 60
    periodSeconds: 5
  readiness:
    enabled: true
    path: /actuator/health/readiness
    periodSeconds: 10
  liveness:
    enabled: true
    path: /actuator/health/liveness
    periodSeconds: 20

serviceMonitor:
  enabled: true
  path: /actuator/prometheus
  interval: 30s

rollingUpdate:
  maxSurge: 1
  maxUnavailable: 0
preStopSleepSeconds: 5

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 1Gi

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false
