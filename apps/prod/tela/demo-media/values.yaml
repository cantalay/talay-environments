# Tela demo içeriği (ADR-T024): açık lisanslı Blender filmleri — 720p MP4, 6 sn TS parçaları, kapaklar (nginx, durağan).
# İmaj tela-core/demo'dan (build-media.sh + Dockerfile). Ingress yok: istemciler https://api.tela.cantalay.com/demo üzerinden
# alır, tela-api bu servise aktarır (Range geçer). Ölçüm ucu yok; erişilebilirlik kube-state-metrics ile izlenir.
fullnameOverride: tela-demo-media
environment: prod
partOf: tela
replicaCount: 1

image:
  repository: ghcr.io/cantalay/tela-demo-media
  tag: "sha-b61df02"
  digest: "sha256:eb5a2e71d18efdb23b896eb293c474be1e8ea4abb1be779fcbdc0b1ef5f8f4d6"
  pullPolicy: IfNotPresent

registrySecret:
  enabled: true
  remoteKey: platform/registry/ghcr
  targetName: ghcr-pull

runtime:
  type: other

containerPort: 8080

observability:
  enabled: false

probes:
  startup:
    enabled: true
    path: /healthz
    failureThreshold: 12
    periodSeconds: 5
  readiness:
    enabled: true
    path: /healthz
    periodSeconds: 10
  liveness:
    enabled: true
    path: /healthz
    periodSeconds: 30

serviceMonitor:
  enabled: false

# Yalnız tela-api erişir.
networkPolicy:
  enabled: true
  additionalIngress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tela-api
      ports:
        - protocol: TCP
          port: 8080

resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    memory: 128Mi

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false
