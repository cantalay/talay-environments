apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - certificate/certificate.yaml
  - ingress/ingress.yaml
  - alerts/prometheusrule.yaml

configMapGenerator:
  - name: hello-api-dashboard
    files:
      - hello-api.json=dashboard/dashboard.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: hello

generatorOptions:
  disableNameSuffixHash: true
